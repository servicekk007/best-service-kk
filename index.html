<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>BEST Service kk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--pri:#6366f1;--dk:#0f172a;--soft:#f1f5f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--card:#151b2e;--tx:#e8ecf5;--mu:#94a3b8;--bd:#263049;--dk:#6366f1;--soft:#1d2540}}
:root[data-theme=dark]{--bg:#0b1020;--card:#151b2e;--tx:#e8ecf5;--mu:#94a3b8;--bd:#263049;--dk:#6366f1;--soft:#1d2540}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Sarabun,system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:270px;flex:none;border-right:1px solid var(--bd);padding:20px 16px;display:flex;flex-direction:column;gap:14px;background:var(--card);position:sticky;top:0;height:100vh}
.logo{display:flex;gap:12px;align-items:center}.logo i{width:46px;height:46px;border-radius:14px;background:var(--dk);color:#fff;display:grid;place-items:center;font-style:normal;font-size:22px}
.logo b{color:var(--pri);font-size:17px;display:block}.logo small{color:var(--mu)}
.box{border:1px solid var(--bd);border-radius:18px;padding:12px;background:var(--soft)}
.box small{font-weight:600;display:block;margin-bottom:8px}
.seg{display:flex;gap:6px}.seg button{flex:1;border:0;border-radius:99px;padding:7px;font:600 12px Sarabun;background:var(--bd);color:var(--tx);cursor:pointer}.seg button.on{background:var(--pri);color:#fff}
nav{display:flex;flex-direction:column;gap:6px}nav button{text-align:left;border:0;background:none;padding:13px 16px;border-radius:16px;font:600 14px Sarabun;color:var(--mu);cursor:pointer}
nav button.on{background:var(--dk);color:#fff;box-shadow:0 6px 16px #0003}
main{flex:1;padding:24px;min-width:0;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:22px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hd h1{margin:0;font-size:21px}.hd p{margin:4px 0 0;color:var(--mu);font-size:13px}
.btn{border:1px solid var(--bd);border-radius:14px;padding:11px 16px;font:600 13px Sarabun;cursor:pointer;background:var(--soft);color:var(--tx)}
.btn.g{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.btn.d{background:var(--dk);color:#fff;border:0}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.st small{color:var(--mu);font-weight:600}.num{font-size:36px;font-weight:800;margin:14px 0 6px}.num span{font-size:13px;color:var(--mu);font-weight:400;margin-left:6px}
.big{font-size:64px;font-weight:800;color:var(--pri);text-align:center;margin:18px 0 4px}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#10b981)}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.p0{color:#059669;background:#ecfdf5;border-color:#a7f3d0}.p1{color:#2563eb;background:#eff6ff;border-color:#bfdbfe}.p2{color:#d97706;background:#fffbeb;border-color:#fde68a}.p3{color:#e11d48;background:#fff1f2;border-color:#fecdd3}
.s-run{color:#4f46e5;background:#eef2ff;border-color:#c7d2fe}.s-done{color:#059669;background:#ecfdf5;border-color:#a7f3d0}.s-wait{color:#64748b;background:var(--soft);border-color:var(--bd)}.s-late{color:#e11d48;background:#fff1f2;border-color:#fecdd3}
.pc{border:1px solid var(--bd);border-radius:18px;padding:16px;text-align:center}.pc b{display:block;font-size:30px;margin:8px 0 2px}.pc small{color:var(--mu)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:14px Sarabun;border:1px solid var(--bd);border-radius:14px;padding:10px 14px;background:var(--soft);color:var(--tx)}
.tools input{flex:1;min-width:200px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1300px;font-size:13px}
th{background:var(--soft);padding:16px 12px;text-align:center;white-space:nowrap;font-size:13px;font-weight:700;vertical-align:middle}td{padding:14px 12px;border-top:1px solid var(--bd);vertical-align:middle;text-align:center}
th:nth-child(3),th:nth-child(4),td:nth-child(3),td:nth-child(4){text-align:left}
th:nth-child(3),td:nth-child(3){min-width:280px;white-space:normal;line-height:1.5}th:nth-child(4),td:nth-child(4){min-width:190px}
td:nth-child(2),td:nth-child(6),td:nth-child(7),td:nth-child(8){white-space:nowrap}th:nth-child(11),td:nth-child(11){min-width:140px;text-align:left}td:nth-child(12){white-space:nowrap}
.av{display:inline-block;background:#eef2ff;color:#4f46e5;border:1px solid #c7d2fe;border-radius:14px;padding:4px 10px;margin:2px;font-size:12px}
.code{color:var(--pri);font-size:11px;font-family:monospace}
.ib{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:7px 9px;cursor:pointer;margin-right:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:8px;overflow-x:auto}
.cal .h{background:var(--soft);border-radius:12px;padding:10px;text-align:center;font-weight:600;font-size:13px}
.cal .d{min-height:110px;border:1px solid var(--bd);border-radius:14px;padding:8px;font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:4px}
.cal .d.e{border-color:transparent;opacity:.4}.cal .d.t{border:2px solid var(--pri);background:#eef2ff22}.cal .d.t>span{background:var(--pri);color:#fff;border-radius:8px;padding:1px 8px;align-self:flex-start}
.cal .d.c{cursor:pointer}.cal .d.c:hover{background:var(--soft)}.pl{font-style:normal;color:var(--pri);opacity:.0;font-weight:800}.cal .d.c:hover .pl{opacity:1}
.ev{font-size:11px;font-weight:400;padding:4px 8px;border-radius:99px;background:#eef2ff;border:1px solid #c7d2fe;color:#4338ca;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev.ok{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.emp{display:flex;gap:12px;align-items:center;justify-content:space-between}.emp>div{display:flex;gap:12px;align-items:center}.emp i{width:56px;height:56px;border-radius:16px;background:#eef2ff;display:grid;place-items:center;font-size:26px;font-style:normal}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border:1px solid var(--bd);border-radius:14px;margin-top:8px;font-size:14px;align-items:center}
.row.s{background:var(--soft);color:var(--pri);font-weight:600}
.mod{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:50;padding:16px}.mod.on{display:grid}
.mod form{background:var(--card);border-radius:24px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px}
.mod label{font-size:13px;font-weight:600;display:grid;gap:5px}.chk{display:flex;gap:10px;flex-wrap:wrap}.chk label{display:flex;font-weight:400;align-items:center;gap:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hide{display:none!important}
@media(max-width:820px){body{flex-direction:column}aside{width:100%;height:auto;position:static}nav{flex-direction:row;flex-wrap:wrap}.two{grid-template-columns:1fr}}
</style></head><body>
<aside>
 <div class="logo"><i>✦</i><div><b>BEST Service kk</b></div></div>
 <div class="box"><small>🛡 สิทธิ์ผู้ใช้งาน:</small><div class="seg"><button id="rH">👑 หัวหน้างาน</button><button id="rE" class="on">👤 พนักงาน</button></div></div>
 <nav id="nav"></nav>
 <div style="flex:1"></div>
 <div class="box"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mu)"><span>สถานะระบบ:</span><b style="color:#059669">⚡ เรียลไทม์</b></div><div id="today" style="font:12px monospace;color:var(--pri);margin-top:8px"></div></div>
</aside>
<main>
 <div class="card hd"><div><h1 id="ttl"></h1><p id="sub"></p></div>
  <div class="tools"><button class="btn" id="dm">🌙</button><button class="btn g" id="ex">⬇ ส่งออก Excel</button><button class="btn d" id="nt">＋ คีย์งานใหม่</button></div></div>
 <div id="v"></div>
</main>
<div class="mod" id="lm"><form id="lf"><h3 style="margin:0">เข้าสู่ระบบหัวหน้างาน</h3><label>อีเมล<input type="email" name="em" required></label><label>รหัสผ่าน<input type="password" name="pw" required></label><div id="le" style="color:#e11d48;font-size:13px"></div><div class="tools" style="justify-content:flex-end"><button type="button" class="btn" onclick="lm.classList.remove('on')">ยกเลิก</button><button class="btn d">เข้าสู่ระบบ</button></div></form></div>
<div class="mod" id="mod"><form id="f"></form></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PR=['ปกติ','สำคัญ','ด่วน','ด่วนมาก'],TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=ymd(new Date()),dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
let T=[],E=[],view='ov',head=false,cm=new Date(),flt={q:'',e:'',s:'',p:''},db=null,edit=null;
$('#today').textContent=TODAY;
const status=t=>t.progress>=100?'เสร็จสิ้น':t.progress>0?'กำลังดำเนินการ':'รอเริ่ม';
const left=t=>t.progress>=100?{x:'เสร็จสิ้นแล้ว',c:'s-done'}:(n=>n<0?{x:'เลยกำหนด '+(-n)+' วัน',c:'s-late'}:{x:'เหลือ '+n+' วัน',c:n<=3?'p2':'s-wait'})(dd(t.deadline,TODAY));
const near=t=>t.progress<100&&dd(t.deadline,TODAY)<=3;
const nm=id=>(E.find(e=>e.id===id)||{name:'(ไม่พบ)'}).name;
const sc=s=>s==='เสร็จสิ้น'?'s-done':s==='รอเริ่ม'?'s-wait':'s-run';
const avg=a=>a.length?Math.round(a.reduce((s,t)=>s+t.progress,0)/a.length):0;
const VIEWS={ov:['หน้าภาพรวมรายงาน (Overview Report)','▦ ภาพรวม (Overview)'],tb:['ตารางงานทั้งหมด (Task List Table)','ตารางงาน'],cal:['ปฏิทินวางแผนงานรายเดือน (Monthly Planner)','ปฏิทินรายเดือน'],em:['รายชื่อพนักงานในแผนกและการมอบหมายงาน','พนักงานในแผนก'],db:['Dashboard การทำงานของพนักงานทั้งหมดและรายบุคคล','Dashboard พนักงาน']};
function nav(){ $('#nav').innerHTML=Object.entries(VIEWS).map(([k,[,l]])=>`<button data-k="${k}" class="${k===view?'on':''}">${l}${k==='tb'?' ('+T.length+')':k==='em'?' ('+E.length+')':''}</button>`).join('')}
$('#nav').onclick=e=>{const k=e.target.dataset.k;if(k){view=k;render()}};
function render(){nav();$('#ttl').textContent=VIEWS[view][0];$('#sub').textContent=head?'👑 โหมดหัวหน้างาน: มีสิทธิ์เพิ่ม แก้ไข และลบข้อมูลทั้งหมด':'👤 โหมดพนักงาน: ดูข้อมูลได้อย่างเดียว (หัวหน้างานกดปุ่มด้านซ้ายเพื่อเข้าสู่ระบบ)';
 $('#nt').classList.toggle('hide',!head);$('#v').innerHTML=({ov,tb,cal,em,db:dash})[view]();
 if(view==='tb'){const q=$('#fq');if(q)q.oninput=()=>{flt.q=q.value;$('#tbody').innerHTML=rows()}}}
function ov(){const sd=head&&!T.length&&!E.length?'<div class="card" style="margin-bottom:16px">ยังไม่มีข้อมูล <button class="btn d" onclick="seed()">โหลดข้อมูลตัวอย่าง</button></div>':'';return sd+ov2()}
function ov2(){const done=T.filter(t=>t.progress>=100).length,pend=T.length-done,nr=T.filter(near).length,p=avg(T),pc=[0,1,2,3].map(i=>T.filter(t=>t.priority===i).length);
 const c=(n,v,sub,col)=>`<div class="card st"><small>${n}</small><div class="num" style="color:${col}">${v}<span>รายการ</span></div><small style="font-weight:400">${sub}</small></div>`;
 return `<div class="grid g4">${c('1. งานทั้งหมด',T.length,'ครอบคลุมภารกิจทั้งหมดในระบบ','var(--tx)')}${c('2. งานที่เสร็จแล้ว',done,'เสร็จสมบูรณ์ความคืบหน้า 100%','#059669')}${c('3. งานที่ค้าง',pend,'รอดำเนินการ / กำลังทำ','#d97706')}${c('4. งานใกล้ DEADLINE',nr,'เหลือเวลาอีกไม่เกิน 3 วัน','#e11d48')}</div>
 <div class="grid" style="grid-template-columns:1fr 2fr;margin-top:16px"><div class="card"><b>✦ ภาพรวมความคืบหน้าเฉลี่ย</b><p style="color:var(--mu);font-size:13px">คำนวณจากเปอร์เซ็นต์ความสำเร็จของทุกงาน</p><div class="big">${p}%</div><p style="text-align:center;color:var(--mu);font-size:13px">อัตราความสำเร็จโดยรวม</p><div class="bar"><i style="width:${p}%"></i></div></div>
 <div class="card"><b>🔥 สัดส่วนงานตามความสำคัญ</b><div class="grid g4" style="margin-top:16px">${PR.map((n,i)=>`<div class="pc"><span class="pill p${i}">${n}</span><b>${pc[i]}</b><small>รายการ</small></div>`).join('')}</div></div></div>`}
function list(){return T.filter(t=>(!flt.q||(t.title+t.code+t.assignees.map(nm).join(' ')).toLowerCase().includes(flt.q.toLowerCase()))&&(!flt.e||t.assignees.includes(flt.e))&&(!flt.s||status(t)===flt.s)&&(flt.p===''||t.priority==+flt.p)).sort((a,b)=>a.created>b.created?1:-1)}
function rows(){return list().map((t,i)=>{const l=left(t);return `<tr><td>${i+1}</td><td>${esc(t.created)}</td><td><b>${esc(t.title)}</b><br><span class="code">${esc(t.code)}</span></td><td>${t.assignees.map(a=>`<span class="av">👤 ${esc(nm(a))}</span>`).join('')}</td><td><span class="pill p${t.priority}">${PR[t.priority]}</span></td><td><b>${t.deadline}</b></td><td>${t.start}</td><td>${t.end}</td><td><span class="pill ${sc(status(t))}">${status(t)}</span></td><td><span class="pill ${l.c}">${l.x}</span></td><td style="min-width:120px"><b>${t.progress}%</b><div class="bar"><i style="width:${t.progress}%"></i></div></td><td>${head?`<button class="ib" onclick="openT('${t.id}')">✎</button><button class="ib" style="color:#e11d48" onclick="delT('${t.id}')">🗑</button>`:'-'}</td></tr>`}).join('')||'<tr><td colspan="12" style="text-align:center;color:var(--mu)">ไม่พบงาน</td></tr>'}
function tb(){const o=(a,sel)=>a.map(([v,l])=>`<option value="${v}" ${String(sel)===String(v)?'selected':''}>${l}</option>`).join('');
 return `<div class="card tools">🔍<input id="fq" placeholder="ค้นหารายละเอียดงาน หรือ ผู้รับผิดชอบ..." value="${esc(flt.q)}"><span style="color:var(--mu)">ตัวกรอง:</span>
 <select onchange="flt.e=this.value;render()">${o([['','พนักงานทั้งหมด'],...E.map(e=>[e.id,e.name])],flt.e)}</select>
 <select onchange="flt.s=this.value;render()">${o([['','ทุกสถานะ'],['รอเริ่ม','รอเริ่ม'],['กำลังดำเนินการ','กำลังดำเนินการ'],['เสร็จสิ้น','เสร็จสิ้น']],flt.s)}</select>
 <select onchange="flt.p=this.value;render()">${o([['','ทุกความสำคัญ'],...PR.map((n,i)=>[i,n])],flt.p)}</select></div>
 <div class="card tw" style="margin-top:16px;padding:0"><table><thead><tr><th>1. ลำดับ</th><th>2. เพิ่มเมื่อ</th><th>3. รายละเอียดงาน</th><th>ผู้รับผิดชอบ (หลายคน)</th><th>4. ความสำคัญ</th><th>5. DEADLINE</th><th>6. เริ่มวันที่</th><th>7. ถึงวันที่</th><th>8. สถานะ (AUTO)</th><th>9. วันคงเหลือ</th><th>10. ความคืบหน้า</th><th>จัดการ</th></tr></thead><tbody id="tbody">${rows()}</tbody></table></div>`}
function cal(){const y=cm.getFullYear(),m=cm.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();
 let h=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'].map((d,i)=>`<div class="h" style="${i==5?'color:#6366f1':i==6?'color:#e11d48':''}">วัน${d}</div>`).join('');
 for(let i=0;i<off;i++)h+='<div class="d e"></div>';
 for(let d=1;d<=n;d++){const s=ymd(new Date(y,m,d));h+=`<div class="d ${s===TODAY?'t':''} ${head?'c':''}" ${head?`onclick="openT(null,'${s}')" title="คลิกเพื่อเพิ่มงานวันที่ ${d}"`:''}><div style="display:flex;justify-content:space-between"><span>${d}</span>${head?'<em class="pl">＋</em>':''}</div>${T.filter(t=>t.start<=s&&s<=t.end).map(t=>`<div class="ev ${t.progress>=100?'ok':''}" style="${head?'cursor:pointer':''}" title="${esc(t.title)}" ${head?`onclick="event.stopPropagation();openT('${t.id}')"`:''}>${esc(t.title)}</div>`).join('')}</div>`}
 return `<div class="card hd"><div><b style="font-size:18px">▦ ${TH[m]} ${y+543}</b><p>ปฏิทินวางแผนงานรายเดือน (วันจันทร์ - วันอาทิตย์)${head?' • คลิกวันที่เพื่อเพิ่มงาน คลิกชื่องานเพื่อแก้ไขหรือลบ':''}</p></div><div class="tools"><button class="btn" onclick="cm=new Date(${y},${m-1},1);render()">‹</button><button class="btn" onclick="cm=new Date();render()">เดือนปัจจุบัน</button><button class="btn" onclick="cm=new Date(${y},${m+1},1);render()">›</button></div></div><div class="card cal" style="margin-top:16px">${h}</div>`}
const mine=id=>T.filter(t=>t.assignees.includes(id));
function em(){return `<div class="card hd"><div><b style="font-size:18px">👥 รายชื่อพนักงานในแผนกและการมอบหมายงาน</b><p>ตรวจสอบว่าพนักงานแต่ละคนกำลังรับผิดชอบงานชิ้นไหนบ้างในระบบ (รองรับ 1 งานหลายผู้รับผิดชอบ)</p></div>${head?'<button class="btn d" onclick="addE()">＋ เพิ่มพนักงานใหม่</button>':''}</div>
 <div class="grid g2" style="margin-top:16px">${E.map(e=>{const m=mine(e.id);return `<div class="card"><div class="emp"><div><i>${esc(e.icon)}</i><div><b>${esc(e.name)}</b><br><small style="color:var(--mu)">${esc(e.role)}</small></div></div>${head?`<button class="ib" style="color:#e11d48" onclick="delE('${e.id}')">🗑</button>`:''}</div>
 <div class="row s"><span style="color:var(--tx);font-weight:400">ภารกิจที่รับผิดชอบทั้งหมด:</span><span>${m.length} งาน (เสร็จแล้ว ${m.filter(t=>t.progress>=100).length})</span></div><p style="font-size:12px;color:var(--mu);margin:14px 0 0">งานที่กำลังรับผิดชอบ:</p>
 ${m.map(t=>`<div class="row"><span>${esc(t.title)}</span><span class="pill ${t.progress>=100?'s-done':'s-run'}">${t.progress}%</span></div>`).join('')||'<div class="row" style="color:var(--mu)">ยังไม่มีงาน</div>'}</div>`}).join('')}</div>`}
function dash(){const p=avg(T);return `<div class="grid g3"><div class="card st"><small>พนักงานทั้งหมดในแผนก</small><div class="num" style="color:#4f46e5">${E.length}<span>คน</span></div></div><div class="card st"><small>งานที่มอบหมายแล้วทั้งหมด</small><div class="num" style="color:#2563eb">${T.length}<span>งาน</span></div></div><div class="card st"><small>อัตราความสำเร็จเฉลี่ยของทีม</small><div class="num" style="color:#059669">${p}%</div></div></div>
 <div class="grid g2" style="margin-top:16px">${E.map(e=>{const m=mine(e.id),d=m.filter(t=>t.progress>=100).length,a=avg(m);return `<div class="card"><div class="emp"><div><i>${esc(e.icon)}</i><div><b>${esc(e.name)}</b><br><small style="color:var(--mu)">${esc(e.role)}</small></div></div><div style="text-align:right"><b style="font-size:26px;color:#4f46e5">${a}%</b><br><small style="color:var(--mu)">ความคืบหน้าเฉลี่ย</small></div></div>
 <div style="display:flex;justify-content:space-between;margin:16px 0 8px;font-weight:600;font-size:13px"><span>ความสำเร็จรวมของ ${esc(e.name)}</span><span>${d} / ${m.length} งานเสร็จสิ้น</span></div><div class="bar"><i style="width:${a}%"></i></div>
 <div class="grid g3" style="margin-top:14px"><div class="pc"><small>งานทั้งหมด</small><b>${m.length}</b></div><div class="pc" style="background:#ecfdf5"><small>เสร็จแล้ว</small><b style="color:#047857">${d}</b></div><div class="pc" style="background:#fffbeb"><small>กำลังทำ/ค้าง</small><b style="color:#b45309">${m.length-d}</b></div></div>
 <p style="font-size:12px;color:var(--mu);margin:14px 0 0">รายละเอียดงานในความรับผิดชอบ:</p>${m.map(t=>`<div class="row"><span>${esc(t.title)}<br><small style="color:var(--mu)">Deadline: ${t.deadline}</small></span><span class="pill ${sc(status(t))}">${status(t)} (${t.progress}%)</span></div>`).join('')}</div>`}).join('')}</div>`}
/* write helpers */
async function w(fn){try{if(!db)throw 0;await fn()}catch(e){alert('บันทึกไม่สำเร็จ: ตรวจสอบการเข้าสู่ระบบและ Security Rules')}}
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function openT(id,date){edit=T.find(t=>t.id===id)||null;const D=date||TODAY,t=edit||{title:'',assignees:[],priority:0,deadline:D,start:D,end:D,progress:0};
 $('#f').innerHTML=`<h3 style="margin:0">${edit?'แก้ไขงาน':'คีย์งานใหม่'}</h3><label>รายละเอียดงาน<input name="title" required value="${esc(t.title)}"></label>
 <label>ผู้รับผิดชอบ (เลือกได้หลายคน)<div class="chk">${E.map(e=>`<label><input type="checkbox" name="as" value="${e.id}" ${t.assignees.includes(e.id)?'checked':''}> ${esc(e.name)}</label>`).join('')}</div></label>
 <div class="two"><label>ความสำคัญ<select name="priority">${PR.map((n,i)=>`<option value="${i}" ${t.priority==i?'selected':''}>${n}</option>`).join('')}</select></label><label>Deadline<input type="date" name="deadline" required value="${t.deadline}"></label>
 <label>เริ่มวันที่<input type="date" name="start" required value="${t.start}"></label><label>ถึงวันที่<input type="date" name="end" required value="${t.end}"></label></div>
 <label>ความคืบหน้า: <span id="pv">${t.progress}</span>%<input type="range" name="progress" min="0" max="100" step="5" value="${t.progress}" oninput="pv.textContent=this.value"></label>
 <div class="tools" style="justify-content:flex-end">${edit?`<button type="button" class="btn" style="color:#e11d48;margin-right:auto" onclick="if(confirm('ลบงานนี้?'))w(async()=>{await db.doc('tasks/'+edit.id).delete();mod.classList.remove('on')})">🗑 ลบงาน</button>`:''}<button type="button" class="btn" onclick="mod.classList.remove('on')">ยกเลิก</button><button class="btn d">บันทึก</button></div>`;mod.classList.add('on')}
$('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),as=f.getAll('as');if(!as.length)return alert('กรุณาเลือกผู้รับผิดชอบอย่างน้อย 1 คน');
 const o={title:f.get('title').trim(),assignees:as,priority:+f.get('priority'),deadline:f.get('deadline'),start:f.get('start'),end:f.get('end'),progress:+f.get('progress')};
 await w(async()=>{if(edit)await db.doc('tasks/'+edit.id).update(o);else{const n=T.length+1;await db.doc('tasks/'+uid()).set({...o,created:TODAY,code:'TSK-'+String(n).padStart(3,'0')+'-'+Math.random().toString(36).slice(2,4).toUpperCase()})}mod.classList.remove('on')})};
const delT=id=>confirm('ลบงานนี้?')&&w(()=>db.doc('tasks/'+id).delete());
const delE=id=>confirm('ลบพนักงานคนนี้?')&&w(()=>db.doc('employees/'+id).delete());
function addE(){const name=prompt('ชื่อ-นามสกุล');if(!name)return;const role=prompt('ตำแหน่ง')||'Staff';const ic=['🎨','💻','⚡','🛡️','📊','🧠'];w(()=>db.doc('employees/'+uid()).set({name,role,icon:ic[E.length%ic.length]}))}
$('#nt').onclick=()=>E.length?openT():alert('กรุณาเพิ่มพนักงานก่อน');
$('#rH').onclick=()=>{if(!head)lm.classList.add('on')};
$('#rE').onclick=()=>{if(head&&window.logout)logout()};
$('#lf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);$('#le').textContent='';try{await login(f.get('em'),f.get('pw'));lm.classList.remove('on');e.target.reset()}catch(x){$('#le').textContent='อีเมลหรือรหัสผ่านไม่ถูกต้อง'}};
window.setUser=u=>{head=!!u;$('#rH').className=head?'on':'';$('#rE').className=head?'':'on';render()};
$('#dm').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0b1020';r.dataset.theme=d?'light':'dark'};
$('#ex').onclick=async()=>{const h=['ลำดับ','เพิ่มเมื่อ','รหัส','รายละเอียดงาน','ผู้รับผิดชอบ','ความสำคัญ','Deadline','เริ่มวันที่','ถึงวันที่','สถานะ','วันคงเหลือ','ความคืบหน้า(%)'];
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"',r=list().map((t,i)=>[i+1,t.created,t.code,t.title,t.assignees.map(nm).join(', '),PR[t.priority],t.deadline,t.start,t.end,status(t),left(t).x,t.progress]);
 const csv='\ufeff'+[h,...r].map(x=>x.map(q).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='workschedule-'+TODAY+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)};
window.initDb=d=>{db=d;d.collection('tasks').onSnapshot(x=>{T=x.docs.map(k=>({id:k.id,...k.data()}));render()},render);
 d.collection('employees').onSnapshot(x=>{E=x.docs.map(k=>({id:k.id,...k.data()}));render()},render)};
window.seed=()=>w(async()=>{const em=[['e1','🎨','สมชาย ใจดี','Lead UI/UX Designer'],['e2','💻','วิภาดา รักงาน','Senior Backend Developer'],['e3','⚡','กิตติ มุ่งมั่น','Fullstack Engineer'],['e4','🛡️','นภา พัฒนา','QA & Security Specialist']];
 for(const [id,icon,name,role] of em)await db.doc('employees/'+id).set({icon,name,role});
 const t=[['t1','TSK-001','2026-11-01','2026-11-04',3,75,['e1','e2'],'ออกแบบ UI/UX หน้าชำระเงินใหม่ รองรับ PromptPay & Credit Card'],['t2','TSK-002','2026-11-02','2026-11-05',1,30,['e2'],'ติดตั้งระบบรักษาความปลอดภัย SSL & Audit Firewall Database'],['t3','TSK-003','2026-10-28','2026-11-02',0,100,['e1','e3'],'ปรับปรุงความเร็ว API Gateway และทำ Caching Redis']];
 for(const [id,code,st,dl,priority,progress,assignees,title] of t)await db.doc('tasks/'+id).set({code,created:st,start:st,end:dl,deadline:dl,priority,progress,assignees,title})});
render();
</script>
