<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>BEST Service kk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--card:#ffffff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--pri:#6366f1;--pri-light:#eef2ff;--dk:#0f172a;--soft:#f1f5f9;--gn:#10b981;--bl:#3b82f6;--yw:#f59e0b;--rd:#f43f5e;--in:#4f46e5;--shadow:0 10px 25px -5px rgba(99,102,241,0.08), 0 8px 10px -6px rgba(99,102,241,0.08)}
:root[data-theme=dark]{--bg:#030712;--card:#0f172a;--tx:#f8fafc;--mu:#94a3b8;--bd:#1e293b;--pri:#6366f1;--soft:#1e293b;--gn:#34d399;--bl:#60a5fa;--yw:#fbbf24;--rd:#fb7185;--in:#a5b4fc;--pri-light:#1e1b4b;--shadow:0 10px 25px -5px rgba(0,0,0,0.3)}
*{box-sizing:border-box}
html{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Sarabun,system-ui,sans-serif;display:flex;min-height:100vh;max-width:100%;overflow-x:clip;padding-top:env(safe-area-inset-top,0px)}
aside{width:270px;flex:none;border-right:1px solid var(--bd);padding:20px 16px;display:flex;flex-direction:column;gap:14px;background:var(--card);position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.02)}
.logo{display:flex;gap:12px;align-items:center}
.logo img{width:46px;height:46px;border-radius:14px;object-fit:contain}
.logo b{color:var(--pri);font-size:17px;font-weight:800}
.box{border:1px solid var(--bd);border-radius:18px;padding:12px;background:var(--soft)}
.box small{font-weight:600;display:block;margin-bottom:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:0;border-radius:99px;padding:7px;font:600 12px Sarabun,sans-serif;background:var(--bd);color:var(--tx);cursor:pointer;transition:all .2s}
.seg button.on{background:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,0.3)}
nav{display:flex;flex-direction:column;gap:6px}
nav button{text-align:left;border:0;background:none;padding:13px 16px;border-radius:16px;font:600 14px Sarabun,sans-serif;color:var(--mu);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px}
nav button:hover{background:var(--soft);color:var(--tx);transform:translateX(4px)}
nav button.on{background:var(--dk);color:#fff;box-shadow:0 8px 20px rgba(15,23,42,0.2)}
main{flex:1;padding:28px;min-width:0;display:flex;flex-direction:column;gap:22px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:24px;min-width:0;box-shadow:var(--shadow);transition:all .3s ease}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hd h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.5px}
.hd p{margin:4px 0 0;color:var(--mu);font-size:13px}
.sub{color:var(--mu);font-size:12.5px;margin:4px 0 14px}
.btn{border:1px solid var(--bd);border-radius:14px;padding:11px 18px;font:600 13px Sarabun,sans-serif;cursor:pointer;background:var(--soft);color:var(--tx);transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.btn.d{background:linear-gradient(135deg,var(--pri),var(--in));color:#fff;border-color:transparent;box-shadow:0 4px 15px rgba(99,102,241,.35)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g4f{grid-template-columns:repeat(4,1fr)}
.st small{color:var(--mu);font-weight:600}
.num{font-size:30px;font-weight:800;margin:10px 0 4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;overflow-wrap:anywhere}
.num span{font-size:13px;color:var(--mu);font-weight:400}
.num.m{font-size:24px}
.big{font-size:56px;font-weight:800;color:var(--pri);text-align:center;margin:14px 0 4px}
.bar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#a855f7,#10b981);border-radius:99px;transition:width .6s cubic-bezier(0.4, 0, 0.2, 1)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:99px;font-size:11.5px;font-weight:700;border:1px solid;white-space:nowrap}
.p0,.p1,.p2,.p3,.s-run,.s-done,.s-late,.ev,.btn.g{--c:var(--in);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-color:color-mix(in srgb,var(--c) 30%,transparent)}
.p0,.s-done,.ev.ok,.btn.g{--c:var(--gn)}.p1{--c:var(--bl)}.p2{--c:var(--yw)}.p3,.s-late{--c:var(--rd)}
.s-wait{color:var(--mu);background:var(--soft);border-color:var(--bd)}
.s-late{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rd) 45%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
.pc{border:1px solid var(--bd);border-radius:18px;padding:16px;text-align:center;background:var(--card);transition:all .2s}
.pc:hover{transform:translateY(-2px);border-color:var(--pri)}
.pc b{display:block;font-size:24px;margin:6px 0 2px}.pc small{color:var(--mu)}
.pc.ok{background:color-mix(in srgb,var(--gn) 10%,transparent);border-color:color-mix(in srgb,var(--gn) 30%,transparent)}.pc.ok b{color:var(--gn)}
.pc.wn{background:color-mix(in srgb,var(--yw) 10%,transparent);border-color:color-mix(in srgb,var(--yw) 30%,transparent)}.pc.wn b{color:var(--yw)}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:linear-gradient(to bottom,var(--card),var(--soft));padding:16px;border-radius:18px;border:1px solid var(--bd)}
input,select,textarea{font:14px Sarabun,sans-serif;border:1.5px solid var(--bd);border-radius:14px;padding:12px 16px;background:var(--card);color:var(--tx);max-width:100%;width:100%;transition:all .2s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(99,102,241,.15);outline:none}
.tools input{flex:1;min-width:200px}.tools select{flex:1;min-width:140px}
.filter-pill-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.f-pill{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 16px;border-radius:99px;font:600 12.5px Sarabun,sans-serif;cursor:pointer;transition:all .2s}
.f-pill:hover{border-color:var(--pri);color:var(--pri)}
.f-pill.active{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 4px 12px rgba(99,102,241,.3)}
.ychips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.ychip{min-width:110px;padding:8px 12px;border-radius:12px;cursor:pointer;background:var(--card);color:var(--tx);border:1px solid var(--bd);text-align:center;transition:all .2s}
.ychip:hover{border-color:var(--pri);transform:translateY(-1px)}
.ychip.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 4px 12px rgba(99,102,241,.3)}
.ychip div:first-child{font-size:10.5px;opacity:.85}.ychip div:last-child{font-size:13px;font-weight:700;margin-top:2px}

/* ตาราง */
.tw{width:100%}
.tcard{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:14px 12px;border-top:1px solid var(--bd);vertical-align:middle;text-align:center}
th{background:var(--soft);font-weight:700;color:var(--mu);border-top:0;font-size:12px;letter-spacing:.3px}
td.l{text-align:left}
tbody tr{transition:background .15s}
tbody tr:hover{background:color-mix(in srgb,var(--pri) 5%,transparent)}
td.empty{color:var(--mu);padding:32px}
.acts{display:inline-flex;gap:6px}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;transition:all .2s}
.ib:hover{background:var(--pri);color:#fff;border-color:var(--pri);transform:translateY(-1px);box-shadow:0 4px 10px rgba(99,102,241,.25)}
.assignee-chip-container{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.assignee-chip{background:var(--pri-light);color:var(--pri);border:1px solid color-mix(in srgb,var(--pri) 20%,transparent);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.assignee-chip::before{content:'👤';font-size:9px}

/* กราฟ */
.hb-list{max-height:440px;overflow-y:auto;padding-right:4px}
.hb{padding:10px 0;border-bottom:1px dashed var(--bd)}.hb:last-child{border-bottom:0}
.hb-top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;margin-bottom:6px}
.hb-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1}
.hb-track i{display:block;height:100%;border-radius:99px}
.hb-line{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:4px}
.hb-line small{width:46px;color:var(--mu);flex:none}
.hb-line b{width:65px;text-align:right;flex:none}
.legend{display:flex;gap:16px;font-size:12.5px;font-weight:600;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* ปฏิทิน */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal .h{background:var(--soft);border-radius:12px;padding:10px 4px;text-align:center;font-weight:700;font-size:12px}
.cal .d{min-width:0;min-height:105px;border:1px solid var(--bd);border-radius:14px;padding:8px;font-weight:600;font-size:12px;display:flex;flex-direction:column;gap:4px;transition:all .2s}
.cal .d.e{border-color:transparent;opacity:.3}
.cal .d.t{border:2px solid var(--pri);background:var(--pri-light)}
.cal .d.t .dn{background:var(--pri);color:#fff;border-radius:8px;padding:2px 8px;width:fit-content}
.cal .d.c{cursor:pointer}.cal .d.c:hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:0 6px 15px rgba(0,0,0,.05)}
.pl{font-style:normal;color:var(--pri);opacity:0;font-weight:800}.cal .d.c:hover .pl{opacity:1}
.ev{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp{display:flex;gap:12px;align-items:center;justify-content:space-between}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border:1px solid var(--bd);border-radius:14px;margin-top:8px;font-size:13.5px;align-items:center;transition:all .2s}
.row:hover{border-color:var(--pri);background:var(--soft);transform:translateX(2px)}
.row.s{background:var(--pri-light);color:var(--pri);font-weight:600;border-color:color-mix(in srgb,var(--pri) 30%,transparent)}

/* Modal */
.mod{position:fixed;inset:0;background:rgba(3,7,18,.65);backdrop-filter:blur(10px);display:none;place-items:center;z-index:50;padding:16px}
.mod.on{display:grid}
.mod form,.pbox{background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:30px;width:min(640px,100%);max-height:92vh;overflow:auto;display:grid;gap:16px;box-shadow:0 25px 60px -15px rgba(0,0,0,.3);animation:pop .25s cubic-bezier(0.16, 1, 0.3, 1)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.mod label,.mod .fl{font-size:13.5px;font-weight:700;display:grid;gap:6px;color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hide{display:none!important}

.staff-selector{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:2px}
.staff-chip{position:relative;display:flex;align-items:center;gap:8px;padding:10px 14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);cursor:pointer;user-select:none;transition:all .2s}
.staff-chip:hover{border-color:var(--pri);background:var(--soft)}
.staff-chip input[type="checkbox"]{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.staff-chip .cbox{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--bd);background:var(--card);display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none;transition:all .2s}
.staff-chip input:checked ~ .cbox{background:var(--pri);border-color:var(--pri)}
.staff-chip input:checked ~ .cbox::after{content:'✓'}
.staff-chip:has(input:checked){border-color:var(--pri);background:var(--pri-light);box-shadow:0 4px 12px rgba(99,102,241,.15)}
.staff-chip .s-name{font-size:13px;font-weight:600;color:var(--tx);line-height:1.25}
.prog-badge{background:var(--pri);color:#fff;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;box-shadow:0 4px 12px rgba(99,102,241,.3)}

.pie-container{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;padding:12px 0}
.pie-chart{width:150px;height:150px;flex:none;border-radius:50%;background:var(--bd);position:relative;display:grid;place-items:center;box-shadow:0 10px 25px rgba(0,0,0,.05)}
.pie-chart::after{content:'';position:absolute;width:90px;height:90px;background:var(--card);border-radius:50%}
.pie-legend{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;max-width:260px;max-height:160px;overflow-y:auto}
.pie-item{display:flex;align-items:center;gap:8px}
.pie-dot{width:12px;height:12px;border-radius:4px;flex:none}
.ic{margin-right:8px}.sh,.sw{display:none}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;background:var(--dk);color:#fff;padding:13px 26px;border-radius:99px;opacity:0;transition:all .3s;z-index:99;pointer-events:none;font-weight:600;box-shadow:0 15px 35px rgba(0,0,0,.3);font-size:13.5px}
#toast.on{opacity:1;bottom:36px}

@media(max-width:820px){
 body{flex-direction:column;padding-bottom:76px}
 aside{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 14px;gap:8px;border-right:0;border-bottom:1px solid var(--bd);overflow:visible}
 aside>div[style="flex:1"],aside .box:last-child,aside .box small{display:none}
 aside .box{padding:6px 10px;flex:1;border-radius:12px}
 .logo img{width:32px;height:32px}
 .logo b{font-size:14px;white-space:nowrap}
 nav{position:fixed;left:0;right:0;bottom:0;z-index:40;flex-direction:row;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px;box-shadow:0 -10px 25px rgba(0,0,0,.08)}
 nav button{flex:1;min-width:0;padding:6px 4px;text-align:center;font-size:10px;border-radius:12px;display:flex;flex-direction:column;align-items:center}
 .ic{display:block;margin:0 0 2px;font-size:18px}.lb{display:none}.sh{display:block}.sw{display:inline}.fw{display:none}
 main{padding:14px;gap:14px}
 .card{padding:18px;border-radius:20px}
 .hd h1{font-size:18px}
 .hd .tools{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .hd .tools .btn{padding:10px;font-size:12px;text-align:center;justify-content:center}
 #dm{grid-column:span 2}
 .g4,.g4f{grid-template-columns:repeat(2,1fr);gap:10px}
 .num{font-size:22px}.big{font-size:42px}
 .tools input,.tools select{width:100%;min-width:100%}
 .two{grid-template-columns:1fr}
 .staff-selector{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<aside>
 <div class="logo"><img src="logo.png" alt="Logo" onerror="this.style.display='none'"><div><b>BEST SERVICE KK</b></div></div>
 <div class="box"><small>🛡 สิทธิ์ผู้ใช้งาน:</small><div class="seg"><button id="rH">👑 หัวหน้างาน</button><button id="rE" class="on">👤 พนักงาน</button></div></div>
 <nav id="nav"></nav>
 <div style="flex:1"></div>
 <div class="box"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mu)"><span>สถานะระบบ:</span><b style="color:var(--gn)">⚡ เรียลไทม์</b></div><div id="today" style="font:12px monospace;color:var(--pri);margin-top:6px"></div></div>

<main>
 <div class="card hd"><div><h1 id="ttl"></h1><p id="sub"></p></div>
  <div class="tools"><button class="btn" id="dm">🌙 โหมด</button><button class="btn g" id="ex">⬇ ส่งออก CSV</button><button class="btn d" id="nt">＋ คีย์งานใหม่</button></div></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PR=['ปกติ','สำคัญ','ด่วน','ด่วนมาก'],TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=ymd(new Date()),dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:0};
const money=v=>num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const kfmt=v=>{v=num(v);const a=Math.abs(v);if(a>=1e6)return (v/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';if(a>=1e3)return (v/1e3).toFixed(a>=1e5?0:1).replace(/\.0$/,'')+'k';return String(Math.round(v))};
const profitOf=x=>x.profit!=null&&x.profit!==''?num(x.profit):num(x.val)-num(x.cost);
const pctW=(v,max)=>Math.max(0,Math.min(100,max>0?v/max*100:0));
let T=[],PM=[],E=[],Contracts=[],Sales=[],view='ov',subView='ov1',head=false,cm=new Date(),flt={q:'',e:'',s:'',p:''},pmMonth='',pmFlt={q:''},salesYear='',salesFlt={q:'',s:''},contractFlt={q:'',s:''},db=null,edit=null,editPM=null,editC=null,editS=null,myId='';
let loaded={t:false,pm:false,e:false};
$('#today').textContent=TODAY;
setInterval(()=>{if(ymd(new Date())!==TODAY)location.reload()},60000);

let actx;
function playBeep(type='success'){
  try{
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    actx=actx||new A();const ctx=actx,osc=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime;
    osc.type='sine';
    if(type==='success'){osc.frequency.setValueAtTime(587.33,t);osc.frequency.setValueAtTime(880,t+.08)}
    else{osc.frequency.setValueAtTime(300,t);osc.frequency.setValueAtTime(200,t+.1)}
    gain.gain.setValueAtTime(.15,t);gain.gain.exponentialRampToValueAtTime(.001,t+.3);
    osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(t+.3);
  }catch(e){}
}

const status=t=>t.progress>=100?'เสร็จสิ้น':t.progress>0?'กำลังดำเนินการ':'รอเริ่ม';
const left=t=>t.progress>=100?{x:'เสร็จสิ้นแล้ว',c:'s-done'}:(n=>n<0?{x:'เลยกำหนด '+(-n)+' วัน',c:'s-late'}:{x:'เหลือ '+n+' วัน',c:n<=3?'p2':'s-wait'})(dd(t.deadline,TODAY));

const nm=id=>(E.find(e=>e.id===id)||{name:'(ไม่พบ)'}).name;
const sc=s=>s==='เสร็จสิ้น'?'s-done':s==='รอเริ่ม'?'s-wait':'s-run';
const avg=a=>a.length?Math.round(a.reduce((s,t)=>s+t.progress,0)/a.length):0;
const mine=id=>T.filter(t=>t.assignees.includes(id));
const lock=what=>`<div class="card" style="text-align:center;padding:50px 20px;color:var(--rd)"><h3>🔒 สำหรับหัวหน้างานเท่านั้น</h3><p>คุณไม่มีสิทธิ์เข้าถึง${what} กรุณาเข้าสู่ระบบด้วยสิทธิ์หัวหน้างาน</p></div>`;
const dueBadge=d=>{if(!d)return '<span style="color:var(--mu);font-size:11px">ไม่ระบุ</span>';const n=dd(d,TODAY);return n<0?`<span class="pill s-late">เลย ${-n} วัน</span>`:n<=3?`<span class="pill p2">ใกล้ถึงกำหนด (${n} วัน)</span>`:`<span class="pill s-wait">เหลือ ${n} วัน</span>`};

const VIEWS={

function nav(){

$('#nav').onclick=e=>{const b=e.target.closest('button'),k=b&&b.dataset.k;if(k){view=k;if(k==='ov')subView='ov1';scrollTo(0,0);render()}};

function render(){
  const a=document.activeElement,v=$('#v');
  const aid=(a&&a.id&&v.contains(a))?a.id:null;let ps=null,pe=null;
  if(aid){try{ps=a.selectionStart;pe=a.selectionEnd}catch(_){}}

  $('#rH').className=head?'on':'';

  $('#ttl').textContent=VIEWS[view][0];

    let tabs=[['ov1','1. หน้าภาพรวมรายงาน'],['ov2','2. Dashboard พนักงาน']];
    if(head)tabs=tabs.concat([['ov3','3. Dashboard สัญญาโครงการ'],['ov4','4. Dashboard งานขาย']]);
    v.innerHTML=`<div class="tabs">${tabs.map(([k,l])=>`<button class="btn ${subView===k?'d':''}" onclick="subView='${k}';render()">${l}</button>`).join('')}</div>`+({ov1:overviewMain,ov2:dash,ov3:contractsDash,ov4:salesDash}[subView])();

  if(view==='pm'){const q=$('#pmq');if(q)q.oninput=()=>{pmFlt.q=q.value;$('#pm-tbody').innerHTML=pmRows()}}

  return sd+`<div class="grid g4">${c('งานทั้งหมด',total,'ครอบคลุมภารกิจทั้งหมดในระบบ','var(--tx)')}${c('งานที่เสร็จแล้ว',done,'เสร็จสมบูรณ์ความคืบหน้า 100%','var(--gn)')}${c('งานที่ค้าง',total-done,'รอดำเนินการ / กำลังทำ','var(--yw)')}${c('งานใกล้ DEADLINE',nr,'เหลือเวลาอีกไม่เกิน 3 วัน','var(--rd)')}</div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><b>📊 สัดส่วนสถานะงานรวม</b><p class="sub">ภาพรวมสถานะการดำเนินงานทั้งหมดในระบบ</p>

/* ---------- Dashboard การเงิน ---------- */
const COLORS=['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#3b82f6','#14b8a6','#f97316','#84cc16'];
const EMPTY='<p style="color:var(--mu);font-size:13px;text-align:center;padding:30px 0">ยังไม่มีข้อมูล</p>';
function groupByLoc(arr){
  const m={};
  arr.forEach(x=>{const k=(x.loc||'').trim()||'ไม่ระบุสถานที่';const o=m[k]||(m[k]={name:k,val:0,cost:0,profit:0,count:0});o.val+=num(x.val);o.cost+=num(x.cost);o.profit+=profitOf(x);o.count++});
  return Object.values(m).sort((a,b)=>b.val-a.val);
}
function pieHTML(items,total){
  let acc=0;
  const sl=items.map((it,i)=>{const p=total>0?Math.max(0,it.val)/total*100:0;const s={...it,p,start:acc,end:acc+p,color:COLORS[i%COLORS.length]};acc+=p;return s});
  const grad=total>0?sl.map(s=>`${s.color} ${s.start}% ${s.end}%`).join(','):'var(--bd) 0% 100%';
  return `<div class="pie-container"><div class="pie-chart" style="background:conic-gradient(${grad})"></div><div class="pie-legend">${sl.map(s=>`<div class="pie-item"><div class="pie-dot" style="background:${s.color}"></div><span style="font-size:12px">${esc(s.name)} (${s.p.toFixed(1)}%)</span></div>`).join('')||'<span style="color:var(--mu)">ยังไม่มีข้อมูล</span>'}</div></div>`;
}
function valBars(items,color){
  const max=Math.max(1,...items.map(i=>i.val));
  return items.length?`<div class="hb-list">${items.map(i=>`<div class="hb"><div class="hb-top"><span class="hb-name" title="${esc(i.name)}">${esc(i.name)}</span><b>${money(i.val)}</b></div><div class="hb-track"><i style="width:${pctW(i.val,max)}%;background:${color}"></i></div></div>`).join('')}</div>`:EMPTY;
}
function cpBars(items){
  const max=Math.max(1,...items.map(i=>Math.max(i.cost,i.profit)));
  return items.length?`<div class="hb-list">${items.map(i=>{const m=i.cost>0?(i.profit/i.cost*100).toFixed(1):'0.0';return `<div class="hb">
    <div class="hb-top"><span class="hb-name" title="${esc(i.name)}">${esc(i.name)}</span><span class="pill p0" style="padding:2px 8px;font-size:10.5px">กำไร ${m}% ของต้นทุน</span></div>
    <div class="hb-line"><small>ต้นทุน</small><div class="hb-track"><i style="width:${pctW(i.cost,max)}%;background:var(--yw)"></i></div><b title="${money(i.cost)}">${kfmt(i.cost)}</b></div>
    <div class="hb-line"><small>กำไร</small><div class="hb-track"><i style="width:${pctW(i.profit,max)}%;background:var(--gn)"></i></div><b title="${money(i.profit)}">${kfmt(i.profit)}</b></div></div>`}).join('')}</div>`:EMPTY;
}
function finDash(arr,o){
  if(!head)return lock(o.lock);
  const items=groupByLoc(arr),tv=arr.reduce((s,x)=>s+num(x.val),0),tc=arr.reduce((s,x)=>s+num(x.cost),0),tp=arr.reduce((s,x)=>s+profitOf(x),0);
  const c=(n,v,col)=>`<div class="card st"><small>${n}</small><div class="num m" style="color:${col}">${money(v)}<span>บาท</span></div></div>`;
  return `<div class="card hd"><div><b style="font-size:18px">${o.title}</b><p>${o.desc}</p></div></div>
  <div class="grid g4" style="margin-top:16px">${c(o.l1,tv,'var(--tx)')}${c(o.l2,tc,'var(--yw)')}${c(o.l3,tp,'var(--gn)')}<div class="card st"><small>${o.l4}</small><div class="num m" style="color:var(--bl)">${arr.length}<span>${o.unit}</span></div></div></div>
  <div class="card st" style="margin-top:16px;background:var(--soft);padding:16px"><div style="font-size:14px;font-weight:700;color:var(--pri);margin-bottom:4px">🏥 ${o.hosp}</div><div style="font-size:28px;font-weight:800">${items.length} <span style="font-size:14px;color:var(--mu);font-weight:400">แห่ง</span></div></div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><b>🔵 ${o.pieT}</b><p class="sub">เปอร์เซ็นต์ของแต่ละโรงพยาบาลเทียบกับยอดรวม</p>${pieHTML(items,tv)}</div>
    <div class="card"><b>📊 ${o.barT}</b><p class="sub">มูลค่า Pre-VAT เรียงจากมากไปน้อย</p>${valBars(items,o.color)}</div>
  </div>
  <div class="card" style="margin-top:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px">
      <div><b>📊 เปรียบเทียบต้นทุนและกำไรสุทธิแยกตามโรงพยาบาล</b><p class="sub" style="margin-bottom:0">พร้อมอัตรากำไรเทียบต้นทุน (% Margin)</p></div>
      <div class="legend"><span><i style="background:var(--yw)"></i>ต้นทุน</span><span><i style="background:var(--gn)"></i>กำไรสุทธิ</span></div>
    </div>${cpBars(items)}</div>`;

const getSalesYear = x => {
  const code = x.ccs || x.date || '';
  if (code.includes('/')) {
    const parts = code.split('/');
    return parts[parts.length - 1].trim();
  }
  return code.slice(2, 4);
};

const filteredSales = () => {
  const q = salesFlt.q.trim().toLowerCase();
  return Sales.filter(x => {
    const y = getSalesYear(x);
    const matchYear = !salesYear || y === salesYear;
    const matchQuery = !q || [x.name, x.loc, x.ccs, x.startDate, x.endDate].join(' ').toLowerCase().includes(q);
    const matchStatus = !salesFlt.s || x.status === salesFlt.s;
    return matchYear && matchQuery && matchStatus;
  }).sort((a, b) => {
    const ccsA = a.ccs || a.date || '';
    const ccsB = b.ccs || b.date || '';
    return ccsB.localeCompare(ccsA, undefined, { numeric: true, sensitivity: 'base' });
  });
};

/* ---------- หน้า PM Maintenance ---------- */
const PM_FILTER_TYPES = [
  'PRE (24"x24"x2")', 'PRE (24"x12"x2")',
  'CARBON (24"x24"x2")', 'CARBON (24"x12"x2")',
  'MEDIUM (24"x24"x12")', 'MEDIUM (24"x12"x12")',
  'MEDIUM SG (24"x24"x4")', 'MEDIUM SG (24"x12"x4")'
];

const filteredPM=()=>{
  const q=pmFlt.q.trim().toLowerCase();
  return PM.filter(x=>(!pmMonth||x.month===pmMonth)&&(!q||[x.title,x.note,JSON.stringify(x.filters||[])].join(' ').toLowerCase().includes(q))).sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));
};

function pmRows(){
  return filteredPM().map((x,i)=>{
    const n=dd(x.deadline,TODAY);
    const dlBadge=n<0?`<span class="pill s-late">เลย ${-n} วัน</span>`:n<=3?`<span class="pill p2">เหลือ ${n} วัน (ใกล้ถึง)</span>`:`<span class="pill s-wait">เหลือ ${n} วัน</span>`;
    const fList=(x.filters&&x.filters.length)?x.filters.map(f=>`• ${esc(f.type)}: <b>${f.count} ตัว</b>`).join('<br>'):'<span class="pill s-wait">ไม่มีการเปลี่ยน Filter</span>';
    return `<tr onclick="openPM('${esc(x.id)}')" style="cursor:pointer">
      <td>${i+1}</td>
      <td class="l"><b>${esc(x.title)}</b><br><small style="color:var(--mu)">📅 เดือน: ${esc(x.month||'-')}</small></td>
      <td class="l">${fList}${x.note?'<br><small style="color:var(--mu)">หมายเหตุ: '+esc(x.note)+'</small>':''}</td>
      <td style="white-space:nowrap">${esc(x.deadline||'-')}<br>${dlBadge}</td>
      <td><span class="acts"><button class="ib" title="จัดการ/แก้ไข" onclick="event.stopPropagation();openPM('${esc(x.id)}')">✎ จัดการ</button><button class="ib" title="ลบ" style="color:var(--rd)" onclick="event.stopPropagation();delPM('${esc(x.id)}')">🗑</button></span></td>
    </tr>`;
  }).join('')||'<tr><td colspan="5" class="empty">ยังไม่มีข้อมูล PM Maintenance</td></tr>';
}

function pmView(){
  const months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

  <div class="card" style="margin-top:16px;padding:12px 16px;background:var(--soft)">

function openPM(id){
  editPM=PM.find(x=>x.id===id)||null;
  const months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const x=editPM||{title:'',month:months[new Date().getMonth()],deadline:TODAY,note:'',filters:[]};

  $('#f').innerHTML=`<h3 style="margin:0">${editPM?'แก้ไขรายการ PM Maintenance':'เพิ่มรายการ PM Maintenance ใหม่'}</h3>
  <div class="two">
    <label>เลือกเดือน PM<select name="month">${months.map(m=>`<option value="${m}" ${x.month===m?'selected':''}>${m}</option>`).join('')}</select></label>
    <label>Deadline (กำหนดส่งมอบ)<input type="date" name="deadline" required value="${esc(x.deadline||TODAY)}"></label>
  </div>
  <label>รายละเอียดงาน<textarea name="title" rows="2" required>${esc(x.title)}</textarea></label>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
    <label style="margin:0"><b>รายการ Filter (ละไว้ได้ถ้าไม่ได้เปลี่ยน)</b></label>
    <button type="button" class="btn" onclick="$('#filter-rows').innerHTML=''" style="font-size:11.5px;padding:3px 8px;color:var(--rd)">ล้างทั้งหมด</button>
  </div>
  <div id="filter-rows" style="display:grid;gap:8px"></div>
  <button type="button" class="btn" onclick="addFilterRow()" style="font-size:12px;padding:6px 12px;width:fit-content">＋ เพิ่มชนิด Filter</button>
  <label style="margin-top:8px">หมายเหตุ<input name="note" value="${esc(x.note||'')}"></label>
  <div class="tools" style="justify-content:flex-end;margin-top:10px">
    ${editPM?'<button type="button" class="btn" style="color:var(--rd);margin-right:auto" onclick="closeMod();delPM(\''+editPM.id+'\')">🗑 ลบรายการ</button>':''}
    <button type="button" class="btn" onclick="closeMod()">ยกเลิก</button><button class="btn d">บันทึกข้อมูล PM</button>
  </div>`;
  
  mod.classList.add('on');
  renderFilterRows(x.filters||[]);

  $('#f').onsubmit=async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const rowsNodes=document.querySelectorAll('.filter-row');
    const filters=[];
    rowsNodes.forEach(r=>{
      const t=r.querySelector('.f-type').value;
      const c=num(r.querySelector('.f-count').value);
      if(c>0)filters.push({type:t,count:c});
    });

    const data={
      title:fd.get('title').trim(),
      month:fd.get('month'),
      deadline:fd.get('deadline'),
      note:fd.get('note').trim(),
      filters,
      created:editPM?editPM.created:TODAY
    };
    await w(async()=>{
      if(editPM){await db.doc('pm_tasks/'+editPM.id).update(data);toast('✅ บันทึกการแก้ไข PM แล้ว')}
      else{await db.doc('pm_tasks/'+uid()).set(data);toast('✅ เพิ่มรายการ PM ใหม่แล้ว')}
      playBeep('success');closeMod();
    });
  };
}

function renderFilterRows(list){
  const container=$('#filter-rows');
  if(!list||!list.length){
    container.innerHTML='';
    return;
  }
  container.innerHTML=list.map((f)=>`<div class="filter-row" style="display:flex;gap:8px;align-items:center">
    <select class="f-type" style="flex:2">${PM_FILTER_TYPES.map(o=>`<option value="${esc(o)}" ${f.type===o?'selected':''}>${esc(o)}</option>`).join('')}</select>
    <input type="number" min="1" class="f-count" value="${f.count||1}" style="flex:1" placeholder="จำนวนตัว">
    <button type="button" class="btn" style="color:var(--rd);padding:10px 12px" onclick="this.closest('.filter-row').remove()">✕</button>
  </div>`).join('');
}

function addFilterRow(){
  const container=$('#filter-rows');
  const div=document.createElement('div');
  div.className='filter-row';
  div.style.cssText='display:flex;gap:8px;align-items:center';
  div.innerHTML=`<select class="f-type" style="flex:2">${PM_FILTER_TYPES.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>
  <input type="number" min="1" class="f-count" value="1" style="flex:1" placeholder="จำนวนตัว">
  <button type="button" class="btn" style="color:var(--rd);padding:10px 12px" onclick="this.closest('.filter-row').remove()">✕</button>`;

}

function cal(){
  const y=cm.getFullYear(),m=cm.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  let h=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'].map((d,i)=>`<div class="h" style="${i==5?'color:var(--in)':i==6?'color:var(--rd)':''}"><span class="fw">วัน${d}</span><span class="sw">${['จ','อ','พ','พฤ','ศ','ส','อา'][i]}</span></div>`).join('');
  for(let i=0;i<off;i++)h+='<div class="d e"></div>';
  for(let d=1;d<=n;d++){
    const s=ymd(new Date(y,m,d));
    h+=`<div class="d ${s===TODAY?'t':''} c" onclick="showDay('${s}')"><div style="display:flex;justify-content:space-between"><span class="dn">${d}</span>${head?'<em class="pl">＋</em>':''}</div>${T.filter(t=>t.start<=s&&s<=t.end).map(t=>`<div class="ev ${t.progress>=100?'ok':''}" style="cursor:pointer" title="${esc(t.title)}" onclick="event.stopPropagation();showT('${esc(t.id)}')">${esc(t.title)}</div>`).join('')}</div>`;
  }
  return `<div class="card hd"><div><b style="font-size:18px">📅 ${TH[m]} ${y+543}</b><p>ปฏิทินวางแผนงานรายเดือน</p></div><div class="tools"><button class="btn" onclick="cm=new Date(${y},${m-1},1);render()">‹</button><button class="btn" onclick="cm=new Date();render()">เดือนปัจจุบัน</button><button class="btn" onclick="cm=new Date(${y},${m+1},1);render()">›</button></div></div><div class="card cal" style="margin-top:16px">${h}</div>`;
}

function showDay(s){

  $('#pb').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">📅 ${d.getDate()} ${TH[d.getMonth()]} ${d.getFullYear()+543}</h3><button class="ib" onclick="pm.classList.remove('on')">✕</button></div>
  <div>${a.map(t=>`<div class="row" style="cursor:pointer" onclick="showT('${esc(t.id)}')"><span>${esc(t.title)}</span><span class="pill ${t.progress>=100?'s-done':'s-run'}">${t.progress}%</span></div>`).join('')||'<p style="color:var(--mu)">ไม่มีงานในวันนี้</p>'}</div>
  ${head?`<button class="btn d" style="width:100%" onclick="pm.classList.remove('on');openT(null,'${s}')">＋ เพิ่มงานวันนี้</button>`:''}`;
  pm.classList.add('on');
}

async function w(fn){try{if(!db)throw new Error('db not ready');await fn()}catch(e){console.error(e);alert('บันทึกไม่สำเร็จ: ตรวจสอบการเข้าสู่ระบบและสิทธิ์การใช้งาน')}}

function openT(id,date){
  if(!head)return;

const mainFormSubmit=async e=>{
  e.preventDefault();if(!head)return;
  const f=new FormData(e.target),as=f.getAll('as');
  if(!as.length)return alert('กรุณาเลือกผู้รับผิดชอบอย่างน้อย 1 คน');
  const o={title:f.get('title').trim(),assignees:as,priority:+f.get('priority'),deadline:f.get('deadline'),start:f.get('start'),end:f.get('end'),progress:Math.round(+f.get('progress'))};
  if(o.end<o.start)return alert('"ถึงวันที่" ต้องไม่ก่อน "เริ่มวันที่"');
  await w(async()=>{
    if(edit)await db.doc('tasks/'+edit.id).update(o);
    else{
      const n=Math.max(0,...T.map(t=>parseInt(String(t.code||'').split('-')[1])||0))+1;
      await db.doc('tasks/'+uid()).set({...o,created:TODAY,code:'TSK-'+String(n).padStart(3,'0')});
    }
    toast('✅ บันทึกเรียบร้อย');playBeep('success');closeMod();
  });
};

let unsubs=[];

function watchAll(){
  unsubs.forEach(u=>{try{u&&u()}catch(_){}});unsubs=[];
  if(!db)return;
  const err=e=>console.error(e);
  unsubs.push(db.collection('tasks').onSnapshot(x=>{T=x.docs.map(normT);render()},err));
  unsubs.push(db.collection('pm_tasks').onSnapshot(x=>{PM=x.docs.map(k=>({id:k.id,...k.data()}));render()},err));
  unsubs.push(db.collection('employees').onSnapshot(x=>{E=x.docs.map(k=>({id:k.id,name:'',role:'',...k.data()}));render()},err));
  if(head){
    unsubs.push(db.collection('contracts').onSnapshot(x=>{Contracts=x.docs.map(k=>({id:k.id,...k.data()}));render()},err));
    unsubs.push(db.collection('sales').onSnapshot(x=>{Sales=x.docs.map(k=>({id:k.id,...k.data()}));render()},err));
  }else{Contracts=[];Sales=[]}
}
