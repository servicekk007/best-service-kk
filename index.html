<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>BEST Service kk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--card:#ffffff;--tx:#090d16;--mu:#64748b;--bd:#e2e8f0;--pri:#4f46e5;--pri-soft:#eef2ff;--dk:#0f172a;--soft:#f1f5f9;--gn:#10b981;--bl:#3b82f6;--yw:#f59e0b;--rd:#f43f5e}
:root[data-theme=dark]{--bg:#030712;--card:#0f172a;--tx:#f8fafc;--mu:#94a3b8;--bd:#1e293b;--pri:#6366f1;--pri-soft:#1e1b4b;--dk:#f8fafc;--soft:#1e293b;--gn:#34d399;--bl:#60a5fa;--yw:#fbbf24;--rd:#fb7185}
*{box-sizing:border-box}
html{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Sarabun','Plus Jakarta Sans',sans-serif;display:flex;min-height:100vh;max-width:100%;overflow-x:clip;padding-top:env(safe-area-inset-top,0px)}
aside{width:260px;flex:none;border-right:1px solid var(--bd);padding:20px 16px;display:flex;flex-direction:column;gap:16px;background:var(--card);position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.02)}
.logo{display:flex;gap:12px;align-items:center}
.logo img{width:42px;height:42px;border-radius:12px;object-fit:contain}
.logo b{color:var(--pri);font-size:16px;font-weight:700}
.box{border:1px solid var(--bd);border-radius:16px;padding:12px;background:var(--soft)}
.box small{font-weight:600;display:block;margin-bottom:8px;font-size:11.5px;color:var(--mu)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:0;border-radius:10px;padding:8px;font:600 12px 'Sarabun',sans-serif;background:var(--bd);color:var(--mu);cursor:pointer;transition:all .2s}
.seg button.on{background:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.25)}
nav{display:flex;flex-direction:column;gap:6px}
nav button{text-align:left;border:0;background:none;padding:12px 14px;border-radius:14px;font:600 13.5px 'Sarabun',sans-serif;color:var(--mu);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px}
nav button:hover{background:var(--soft);color:var(--tx)}
nav button.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
main{flex:1;padding:24px;min-width:0;display:flex;flex-direction:column;gap:20px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;min-width:0;box-shadow:0 4px 20px -2px rgba(0,0,0,.03)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hd h1{margin:0;font-size:20px;font-weight:700}.hd p{margin:4px 0 0;color:var(--mu);font-size:12.5px}
.sub{color:var(--mu);font-size:12.5px;margin:4px 0 14px}
.btn{border:1px solid var(--bd);border-radius:12px;padding:10px 16px;font:600 13px 'Sarabun',sans-serif;cursor:pointer;background:var(--soft);color:var(--tx);transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bd);transform:translateY(-1px)}
.btn.d{background:var(--pri);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(79,70,229,.2)}
.btn.d:hover{filter:brightness(1.1)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4f{grid-template-columns:repeat(4,1fr)}
.st{position:relative;overflow:hidden}
.st::after{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--pri);border-radius:4px 0 0 4px}
.st small{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.num{font-size:28px;font-weight:800;margin:8px 0 2px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.num span{font-size:12.5px;color:var(--mu);font-weight:400}
.num.m{font-size:22px}
.big{font-size:52px;font-weight:800;color:var(--pri);text-align:center;margin:12px 0 4px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--gn));border-radius:99px}
.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.p0,.s-done,.ev.ok,.btn.g{background:rgba(16,185,129,.1);color:var(--gn);border-color:rgba(16,185,129,.2)}
.p1{background:rgba(59,130,246,.1);color:var(--bl);border-color:rgba(59,130,246,.2)}
.p2{background:rgba(245,158,11,.1);color:var(--yw);border-color:rgba(245,158,11,.2)}
.p3,.s-late{background:rgba(244,63,94,.1);color:var(--rd);border-color:rgba(244,63,94,.2)}
.s-run{background:rgba(99,102,241,.1);color:var(--pri);border-color:rgba(99,102,241,.2)}
.s-wait{color:var(--mu);background:var(--soft);border-color:var(--bd)}
.s-late{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(244,63,94,.4)}70%,100%{box-shadow:0 0 0 6px transparent}}
.pc{border:1px solid var(--bd);border-radius:16px;padding:16px;text-align:center;background:var(--card)}
.pc b{display:block;font-size:22px;margin:6px 0 2px;font-weight:700}.pc small{color:var(--mu);font-size:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:14px 'Sarabun',sans-serif;border:1px solid var(--bd);border-radius:14px;padding:11px 16px;background:var(--soft);color:var(--tx);max-width:100%;width:100%;transition:all .2s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(79,70,229,.12);outline:none;background:var(--card)}
.tools input{flex:1;min-width:180px}.tools select{flex:1;min-width:130px}
.filter-pill-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.f-pill{border:1px solid var(--bd);background:var(--card);color:var(--mu);padding:7px 16px;border-radius:99px;font:600 12.5px 'Sarabun',sans-serif;cursor:pointer;transition:all .2s}
.f-pill:hover{border-color:var(--pri);color:var(--tx)}
.f-pill.active{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 4px 12px rgba(79,70,229,.2)}

/* ตาราง */
.tw{width:100%}
.tcard{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:14px 12px;border-top:1px solid var(--bd);vertical-align:middle;text-align:center}
th{background:var(--soft);font-weight:700;color:var(--mu);border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td.l{text-align:left}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--soft)}
td.empty{color:var(--mu);padding:32px;font-size:14px}
.acts{display:inline-flex;gap:6px}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;transition:all .2s}
.ib:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
.assignee-chip-container{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.assignee-chip{background:var(--pri-soft);color:var(--pri);border:1px solid rgba(79,70,229,.2);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600}

/* กราฟ */
.hb-list{max-height:420px;overflow-y:auto;padding-right:4px}
.hb{padding:10px 0;border-bottom:1px dashed var(--bd)}.hb:last-child{border-bottom:0}
.hb-top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;margin-bottom:6px}
.hb-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1}
.hb-track i{display:block;height:100%;border-radius:99px}
.legend{display:flex;gap:16px;font-size:12px;font-weight:600;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* ปฏิทิน */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal .h{background:var(--soft);border-radius:12px;padding:10px 4px;text-align:center;font-weight:700;font-size:12px;color:var(--mu)}
.cal .d{min-width:0;min-height:105px;border:1px solid var(--bd);border-radius:14px;padding:8px;font-weight:600;font-size:12px;display:flex;flex-direction:column;gap:4px;background:var(--card);transition:all .2s}
.cal .d.e{border-color:transparent;opacity:.3}
.cal .d.t{border:2px solid var(--pri);background:var(--pri-soft)}
.cal .d.t .dn{background:var(--pri);color:#fff;border-radius:8px;padding:2px 8px;width:fit-content}
.cal .d.c{cursor:pointer}.cal .d.c:hover{border-color:var(--pri);transform:translateY(-2px)}
.ev{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp{display:flex;gap:12px;align-items:center;justify-content:space-between}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border:1px solid var(--bd);border-radius:14px;margin-top:8px;font-size:13px;align-items:center;background:var(--card)}
.row:hover{border-color:var(--pri)}
.row.s{background:var(--soft);color:var(--pri);font-weight:600}

/* Modal */
.mod{position:fixed;inset:0;background:rgba(3,7,18,.6);backdrop-filter:blur(8px);display:none;place-items:center;z-index:50;padding:16px}
.mod.on{display:grid}
.mod form,.pbox{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:28px;width:min(580px,100%);max-height:92vh;overflow:auto;display:grid;gap:16px;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);animation:pop .25s cubic-bezier(0.16, 1, 0.3, 1)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.mod label,.mod .fl{font-size:13px;font-weight:700;display:grid;gap:6px;color:var(--tx)}
.chk{display:flex;gap:12px;flex-wrap:wrap}.chk label{display:flex;font-weight:400;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hide{display:none!important}

.pie-container{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;padding:12px 0}
.pie-chart{width:140px;height:140px;flex:none;border-radius:50%;background:var(--bd);position:relative;display:grid;place-items:center}
.pie-chart::after{content:'';position:absolute;width:84px;height:84px;background:var(--card);border-radius:50%}
.pie-legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;font-weight:600;max-width:240px;max-height:160px;overflow-y:auto}
.pie-item{display:flex;align-items:center;gap:8px}
.pie-dot{width:12px;height:12px;border-radius:4px;flex:none}
.ic{margin-right:8px}.sh,.sw{display:none}

#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;background:var(--dk);color:#fff;padding:12px 24px;border-radius:99px;opacity:0;transition:all .3s;z-index:99;pointer-events:none;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,.2);font-size:13px}
#toast.on{opacity:1;bottom:92px}

/* คลาสควบคุมการแสดงผลบนมือถือและคอม */
.desktop-table{display:table}
.mobile-cards{display:none}

/* มือถือ Responsive */
@media(max-width:820px){
 body{flex-direction:column;padding-bottom:76px}
 aside{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 14px;gap:8px;border-right:0;border-bottom:1px solid var(--bd);box-shadow:none}
 aside>div[style="flex:1"],aside .box:last-child,aside .box small{display:none}
 aside .box{padding:6px 10px;flex:none;border-radius:12px}
 .logo img{width:32px;height:32px}
 .logo b{font-size:14px;white-space:nowrap}
 nav{position:fixed;left:0;right:0;bottom:0;z-index:40;flex-direction:row;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px;box-shadow:0 -10px 25px rgba(0,0,0,.06)}
 nav button{flex:1;min-width:0;padding:6px 4px;text-align:center;font-size:10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
 .ic{display:block;margin:0;font-size:18px}.lb{display:none}.sh{display:block}.sw{display:inline}.fw{display:none}
 main{padding:12px;gap:12px}
 .card{padding:16px;border-radius:18px}
 .hd h1{font-size:18px}
 .hd .tools{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px}
 .hd .tools .btn{padding:10px;font-size:12px;text-align:center;justify-content:center}
 #dm{grid-column:span 2}
 .g4,.g4f{grid-template-columns:repeat(2,1fr);gap:10px}
 .num{font-size:22px}.big{font-size:42px}
 .tools input,.tools select{width:100%;min-width:100%;padding:10px 14px}
 .two{grid-template-columns:1fr}
 
 /* สลับให้ตารางซ่อน และแสดงการ์ดบนมือถือแทน */
 .desktop-table{display:none!important}
 .mobile-cards{display:flex!important;flex-direction:column;gap:10px}
 .tcard{background:transparent;border:0;box-shadow:none}
 .m-card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.03);display:flex;flex-direction:column;gap:8px}
 .m-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
 .m-card-body{font-size:12.5px;color:var(--mu);display:grid;gap:4px;border-top:1px dashed var(--bd);border-bottom:1px dashed var(--bd);padding:8px 0}
 .m-card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:4px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<aside>
 <div class="logo"><img src="logo.png" alt="Logo" onerror="this.style.display='none'"><div><b>BEST SERVICE KK</b></div></div>
 <div class="box"><small>🛡 สิทธิ์ผู้ใช้งาน:</small><div class="seg"><button id="rH">👑 หัวหน้างาน</button><button id="rE" class="on">👤 พนักงาน</button></div></div>
 <nav id="nav"></nav>
 <div style="flex:1"></div>
 <div class="box"><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--mu)"><span>สถานะระบบ:</span><b style="color:var(--gn)">⚡ เรียลไทม์</b></div><div id="today" style="font:11.5px monospace;color:var(--pri);margin-top:6px"></div></div>
</aside>
<main>
 <div class="card hd"><div><h1 id="ttl"></h1><p id="sub"></p></div>
  <div class="tools"><button class="btn" id="dm">🌙 โหมด</button><button class="btn g" id="ex">⬇ CSV</button><button class="btn d" id="nt">＋ เพิ่มข้อมูล</button></div></div>
 <div id="v"></div>
</main>
<div class="mod" id="lm"><form id="lf"><h3 style="margin:0">เข้าสู่ระบบหัวหน้างาน</h3><label>อีเมล<input type="email" name="em" required autocomplete="username"></label><label>รหัสผ่าน<input type="password" name="pw" required autocomplete="current-password"></label><div id="le" style="color:var(--rd);font-size:12.5px"></div><div class="tools" style="justify-content:flex-end"><button type="button" class="btn" onclick="lm.classList.remove('on')">ยกเลิก</button><button class="btn d">เข้าสู่ระบบ</button></div></form></div>
<div class="mod" id="pm"><div class="pbox" id="pb"></div></div>
<div id="toast"></div>
<div class="mod" id="mod"><form id="f"></form></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PR=['ปกติ','สำคัญ','ด่วน','ด่วนมาก'],TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=ymd(new Date()),dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:0};
const money=v=>num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const kfmt=v=>{v=num(v);const a=Math.abs(v);if(a>=1e6)return (v/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';if(a>=1e3)return (v/1e3).toFixed(a>=1e5?0:1).replace(/\.0$/,'')+'k';return String(Math.round(v))};
const profitOf=x=>x.profit!=null&&x.profit!==''?num(x.profit):num(x.val)-num(x.cost);
const pctW=(v,max)=>Math.max(0,Math.min(100,max>0?v/max*100:0));
let T=[],PM=[],E=[],Contracts=[],Sales=[],view='ov',subView='ov1',head=false,cm=new Date(),flt={q:'',e:'',s:'',p:''},pmMonth='',pmFlt={q:''},salesYear='',salesFlt={q:'',s:''},contractFlt={q:'',s:''},db=null,edit=null,editPM=null,editC=null,editS=null,myId='';
let loaded={t:false,pm:false,e:false};
$('#today').textContent=TODAY;
setInterval(()=>{if(ymd(new Date())!==TODAY)location.reload()},60000);

let actx;
function playBeep(type='success'){
  try{
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    actx=actx||new A();const ctx=actx,osc=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime;
    osc.type='sine';
    if(type==='success'){osc.frequency.setValueAtTime(587.33,t);osc.frequency.setValueAtTime(880,t+.08)}
    else{osc.frequency.setValueAtTime(300,t);osc.frequency.setValueAtTime(200,t+.1)}
    gain.gain.setValueAtTime(.15,t);gain.gain.exponentialRampToValueAtTime(.001,t+.3);
    osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(t+.3);
  }catch(e){}
}

const status=t=>t.progress>=100?'เสร็จสิ้น':t.progress>0?'กำลังดำเนินการ':'รอเริ่ม';
const left=t=>t.progress>=100?{x:'เสร็จสิ้นแล้ว',c:'s-done'}:(n=>n<0?{x:'เลยกำหนด '+(-n)+' วัน',c:'s-late'}:{x:'เหลือ '+n+' วัน',c:n<=3?'p2':'s-wait'})(dd(t.deadline,TODAY));
const near=t=>t.progress<100&&dd(t.deadline,TODAY)<=3;
const nm=id=>(E.find(e=>e.id===id)||{name:'(ไม่พบ)'}).name;
const sc=s=>s==='เสร็จสิ้น'?'s-done':s==='รอเริ่ม'?'s-wait':'s-run';
const avg=a=>a.length?Math.round(a.reduce((s,t)=>s+t.progress,0)/a.length):0;
const mine=id=>T.filter(t=>t.assignees.includes(id));
const lock=what=>`<div class="card" style="text-align:center;padding:50px 20px;color:var(--rd)"><h3>🔒 สำหรับหัวหน้างานเท่านั้น</h3><p>คุณไม่มีสิทธิ์เข้าถึง${what}</p></div>`;
const dueBadge=d=>{if(!d)return '<span style="color:var(--mu);font-size:11px">ไม่ระบุ</span>';const n=dd(d,TODAY);return n<0?`<span class="pill s-late">เลย ${-n} วัน</span>`:n<=3?`<span class="pill p2">เหลือ ${n} วัน (ใกล้กำหนด)</span>`:`<span class="pill s-wait">เหลือ ${n} วัน</span>`};

const VIEWS={
  ov:['ภาพรวมระบบ (Overview)','ภาพรวม'],
  tb:['ตารางงานทั้งหมด (Tasks)','ตารางงาน'],
  pm:['PM Maintenance','PM'],
  cal:['ปฏิทินวางแผนงาน (Calendar)','ปฏิทิน'],
  em:['รายชื่อพนักงาน (Team)','พนักงาน'],

function nav(){

function render(){
  const a=document.activeElement,v=$('#v');

  $('#rH').className=head?'on':'';
  $('#rE').className=head?'':'on';

  $('#ttl').textContent=VIEWS[view][0];
  $('#sub').textContent=head?'👑 โหมดหัวหน้างาน: มีสิทธิ์บริหารจัดการทุกเมนูในระบบ':'👤 โหมดพนักงาน: จัดการ PM Maintenance ได้เต็มที่ และอัปเดตความคืบหน้างาน';

    if(head)tabs=tabs.concat([['ov3','💼 สัญญา'],['ov4','📈 ยอดขาย']]);
    v.innerHTML=`<div class="tabs">${tabs.map(([k,l])=>`<button class="btn ${subView===k?'d':''}" onclick="subView='${k}';render()">${l}</button>`).join('')}</div>`+({ov1:overviewMain,ov2:dash,ov3:contractsDash,ov4:salesDash}[subView])();

  <div class="grid g2" style="margin-top:16px">
    <div class="card"><b>📊 สัดส่วนสถานะงานรวม</b>
      <div class="pie-container"><div class="pie-chart" style="background:conic-gradient(${grad})"></div>

/* ---------- Dashboard การเงิน ---------- */
const COLORS=['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#3b82f6','#14b8a6','#f97316','#84cc16'];
const EMPTY='<p style="color:var(--mu);font-size:13px;text-align:center;padding:30px 0">ยังไม่มีข้อมูลในระบบ</p>';
function groupByLoc(arr){
  const m={};
  arr.forEach(x=>{const k=(x.loc||'').trim()||'ไม่ระบุสถานที่';const o=m[k]||(m[k]={name:k,val:0,cost:0,profit:0,count:0});o.val+=num(x.val);o.cost+=num(x.cost);o.profit+=profitOf(x);o.count++});
  return Object.values(m).sort((a,b)=>b.val-a.val);
}
function pieHTML(items,total){
  let acc=0;
  const sl=items.map((it,i)=>{const p=total>0?Math.max(0,it.val)/total*100:0;const s={...it,p,start:acc,end:acc+p,color:COLORS[i%COLORS.length]};acc+=p;return s});
  const grad=total>0?sl.map(s=>`${s.color} ${s.start}% ${s.end}%`).join(','):'var(--bd) 0% 100%';
  return `<div class="pie-container"><div class="pie-chart" style="background:conic-gradient(${grad})"></div><div class="pie-legend">${sl.map(s=>`<div class="pie-item"><div class="pie-dot" style="background:${s.color}"></div><span style="font-size:12px">${esc(s.name)} (${s.p.toFixed(1)}%)</span></div>`).join('')||'<span style="color:var(--mu)">ไม่มีข้อมูล</span>'}</div></div>`;
}
function valBars(items,color){
  const max=Math.max(1,...items.map(i=>i.val));
  return items.length?`<div class="hb-list">${items.map(i=>`<div class="hb"><div class="hb-top"><span class="hb-name" title="${esc(i.name)}">${esc(i.name)}</span><b>${money(i.val)}</b></div><div class="hb-track"><i style="width:${pctW(i.val,max)}%;background:${color}"></i></div></div>`).join('')}</div>`:EMPTY;
}
function cpBars(items){
  const max=Math.max(1,...items.map(i=>Math.max(i.cost,i.profit)));
  return items.length?`<div class="hb-list">${items.map(i=>{const m=i.cost>0?(i.profit/i.cost*100).toFixed(1):'0.0';return `<div class="hb">
    <div class="hb-top"><span class="hb-name" title="${esc(i.name)}">${esc(i.name)}</span><span class="pill p0" style="padding:2px 8px;font-size:10.5px">กำไร ${m}% ของต้นทุน</span></div>
    <div class="hb-line"><small style="width:50px">ต้นทุน</small><div class="hb-track"><i style="width:${pctW(i.cost,max)}%;background:var(--yw)"></i></div><b style="width:70px;text-align:right">${kfmt(i.cost)}</b></div>
    <div class="hb-line"><small style="width:50px">กำไรสุทธิ</small><div class="hb-track"><i style="width:${pctW(i.profit,max)}%;background:var(--gn)"></i></div><b style="width:70px;text-align:right">${kfmt(i.profit)}</b></div></div>`}).join('')}</div>`:EMPTY;
}
function finDash(arr,o){

    </div>${cpBars(items)}</div>`;
}

function cal(){
  const y=cm.getFullYear(),m=cm.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  let h=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'].map((d,i)=>`<div class="h" style="${i==5?'color:var(--in)':i==6?'color:var(--rd)':''}"><span class="fw">วัน${d}</span><span class="sw">${['จ','อ','พ','พฤ','ศ','ส','อา'][i]}</span></div>`).join('');
  for(let i=0;i<off;i++)h+='<div class="d e"></div>';
  for(let d=1;d<=n;d++){
    const s=ymd(new Date(y,m,d));
    h+=`<div class="d ${s===TODAY?'t':''} c" onclick="showDay('${s}')"><div style="display:flex;justify-content:space-between"><span class="dn">${d}</span>${head?'<em class="pl">＋</em>':''}</div>${T.filter(t=>t.start<=s&&s<=t.end).map(t=>`<div class="ev ${t.progress>=100?'ok':''}" style="cursor:pointer" title="${esc(t.title)}" onclick="event.stopPropagation();showT('${esc(t.id)}')">${esc(t.title)}</div>`).join('')}</div>`;
  }
  return `<div class="card hd"><div><b style="font-size:18px">📅 ${TH[m]} ${y+543}</b></div><div class="tools"><button class="btn" onclick="cm=new Date(${y},${m-1},1);render()">‹</button><button class="btn" onclick="cm=new Date();render()">เดือนนี้</button><button class="btn" onclick="cm=new Date(${y},${m+1},1);render()">›</button></div></div><div class="card cal" style="margin-top:16px">${h}</div>`;
}
