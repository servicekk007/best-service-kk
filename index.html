<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>BEST Service kk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--pri:#6366f1;--dk:#0f172a;--soft:#f1f5f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--card:#151b2e;--tx:#e8ecf5;--mu:#94a3b8;--bd:#263049;--dk:#6366f1;--soft:#1d2540}}
:root[data-theme=dark]{--bg:#0b1020;--card:#151b2e;--tx:#e8ecf5;--mu:#94a3b8;--bd:#263049;--dk:#6366f1;--soft:#1d2540}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Sarabun,system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:270px;flex:none;border-right:1px solid var(--bd);padding:20px 16px;display:flex;flex-direction:column;gap:14px;background:var(--card);position:sticky;top:0;height:100vh}
.logo{display:flex;gap:12px;align-items:center}.logo i{width:46px;height:46px;border-radius:14px;background:var(--dk);color:#fff;display:grid;place-items:center;font-style:normal;font-size:22px}
.logo b{color:var(--pri);font-size:17px;display:block}.logo small{color:var(--mu)}
.box{border:1px solid var(--bd);border-radius:18px;padding:12px;background:var(--soft)}
.box small{font-weight:600;display:block;margin-bottom:8px}
.seg{display:flex;gap:6px}.seg button{flex:1;border:0;border-radius:99px;padding:7px;font:600 12px Sarabun;background:var(--bd);color:var(--tx);cursor:pointer}.seg button.on{background:var(--pri);color:#fff}

/* --- ส่วนที่แก้ไข: ปรับแถบเมนูให้เล็กลง --- */
nav{display:flex;flex-direction:column;gap:4px}
nav button{text-align:left;border:0;background:none;padding:10px 14px;border-radius:12px;font:600 13px Sarabun;color:var(--mu);cursor:pointer}
nav button.on{background:var(--dk);color:#fff;box-shadow:0 6px 16px #0003}

main{flex:1;padding:24px;min-width:0;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:22px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hd h1{margin:0;font-size:21px}.hd p{margin:4px 0 0;color:var(--mu);font-size:13px}
.btn{border:1px solid var(--bd);border-radius:14px;padding:11px 16px;font:600 13px Sarabun;cursor:pointer;background:var(--soft);color:var(--tx)}
.btn.g{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.btn.d{background:var(--dk);color:#fff;border:0}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.st small{color:var(--mu);font-weight:600}.num{font-size:36px;font-weight:800;margin:14px 0 6px}.num span{font-size:13px;color:var(--mu);font-weight:400;margin-left:6px}
.big{font-size:64px;font-weight:800;color:var(--pri);text-align:center;margin:18px 0 4px}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#10b981)}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.p0{color:#059669;background:#ecfdf5;border-color:#a7f3d0}.p1{color:#2563eb;background:#eff6ff;border-color:#bfdbfe}.p2{color:#d97706;background:#fffbeb;border-color:#fde68a}.p3{color:#e11d48;background:#fff1f2;border-color:#fecdd3}
.s-run{color:#4f46e5;background:#eef2ff;border-color:#c7d2fe}.s-done{color:#059669;background:#ecfdf5;border-color:#a7f3d0}.s-wait{color:#64748b;background:var(--soft);border-color:var(--bd)}.s-late{color:#e11d48;background:#fff1f2;border-color:#fecdd3}
.pc{border:1px solid var(--bd);border-radius:18px;padding:16px;text-align:center}.pc b{display:block;font-size:30px;margin:8px 0 2px}.pc small{color:var(--mu)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:14px Sarabun;border:1px solid var(--bd);border-radius:14px;padding:10px 14px;background:var(--soft);color:var(--tx)}
.tools input{flex:1;min-width:200px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--soft);padding:14px 8px;text-align:center;white-space:nowrap;font-size:13px;font-weight:700;vertical-align:middle}td{padding:12px 8px;border-top:1px solid var(--bd);vertical-align:middle;text-align:center}
th:nth-child(3),th:nth-child(4),td:nth-child(3),td:nth-child(4){text-align:left}
th:nth-child(3),td:nth-child(3){min-width:200px;white-space:normal;line-height:1.5}th:nth-child(4),td:nth-child(4){min-width:150px}
td:nth-child(2),td:nth-child(6),td:nth-child(7),td:nth-child(8){white-space:nowrap}th:nth-child(11),td:nth-child(11){min-width:105px;text-align:left}@media(max-width:1450px){th:nth-child(2),td:nth-child(2){display:none}}td:nth-child(12){white-space:nowrap}
.av{display:inline-block;background:#eef2ff;color:#4f46e5;border:1px solid #c7d2fe;border-radius:14px;padding:4px 10px;margin:2px;font-size:12px}
.code{color:var(--pri);font-size:11px;font-family:monospace}
.ib{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:7px 9px;cursor:pointer;margin-right:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:8px;overflow-x:auto}
.cal .h{background:var(--soft);border-radius:12px;padding:10px;text-align:center;font-weight:600;font-size:13px}
.cal .d{min-height:110px;border:1px solid var(--bd);border-radius:14px;padding:8px;font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:4px}
.cal .d.e{border-color:transparent;opacity:.4}.cal .d.t{border:2px solid var(--pri);background:#eef2ff22}.cal .d.t>span{background:var(--pri);color:#fff;border-radius:8px;padding:1px 8px;align-self:flex-start}
.cal .d.c{cursor:pointer}.cal .d.c:hover{background:var(--soft)}.pl{font-style:normal;color:var(--pri);opacity:.0;font-weight:800}.cal .d.c:hover .pl{opacity:1}
.ev{font-size:11px;font-weight:400;padding:4px 8px;border-radius:99px;background:#eef2ff;border:1px solid #c7d2fe;color:#4338ca;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev.ok{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.emp{display:flex;gap:12px;align-items:center;justify-content:space-between}.emp>div{display:flex;gap:12px;align-items:center}.emp i{width:56px;height:56px;border-radius:16px;background:#eef2ff;display:grid;place-items:center;font-size:26px;font-style:normal}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border:1px solid var(--bd);border-radius:14px;margin-top:8px;font-size:14px;align-items:center}
.row.s{background:var(--soft);color:var(--pri);font-weight:600}
.mod{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:50;padding:16px}.mod.on{display:grid}
.mod form{background:var(--card);border-radius:24px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px}
.mod label{font-size:13px;font-weight:600;display:grid;gap:5px}.chk{display:flex;gap:10px;flex-wrap:wrap}.chk label{display:flex;font-weight:400;align-items:center;gap:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hide{display:none!important}

/* --- ส่วนที่แก้ไข: ลบรูปภาพและไอคอนหน้าชื่อเมนูออกทั้งหมด --- */
.ic, nav button i, nav button img{display:none!important}.sh,.sw{display:none}

@keyframes pop{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fu{from{opacity:0;transform:translateY(10px)}}
@keyframes gw{from{width:0}}
.mod.on form,.pbox{animation:pop .22s ease}
.pbox{background:var(--card);border-radius:24px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto}
#v.an .card,#v.an .pc{animation:fu .45s ease both}#v.an .bar i{animation:gw .9s ease}
.card.st,.pc,.btn,nav button{transition:transform .2s,box-shadow .2s,background .2s}
.card.st:hover,.pc:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0002}.btn:hover{transform:translateY(-1px)}
#toast
</style>
