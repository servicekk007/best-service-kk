<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>BEST Service kk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#cbd5e1;--pri:#6366f1;--dk:#0f172a;--soft:#e2e8f0;--gn:#059669;--bl:#2563eb;--yw:#d97706;--rd:#e11d48;--in:#4f46e5}
:root[data-theme=dark]{--bg:#070a14;--card:#111827;--tx:#f3f4f6;--mu:#9ca3af;--bd:#1f2937;--dk:#6366f1;--soft:#1f2937;--gn:#34d399;--bl:#60a5fa;--yw:#fbbf24;--rd:#fb7185;--in:#a5b4fc}
*{box-sizing:border-box}
html{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Sarabun,system-ui,sans-serif;display:flex;min-height:100vh;max-width:100%;overflow-x:clip;padding-top:env(safe-area-inset-top,0px)}
aside{width:270px;flex:none;border-right:1px solid var(--bd);padding:20px 16px;display:flex;flex-direction:column;gap:14px;background:var(--card);position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;gap:12px;align-items:center}
.logo img{width:46px;height:46px;border-radius:14px;object-fit:contain}
.logo b{color:var(--pri);font-size:17px}
.box{border:1px solid var(--bd);border-radius:18px;padding:12px;background:var(--soft)}
.box small{font-weight:600;display:block;margin-bottom:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:0;border-radius:99px;padding:7px;font:600 12px Sarabun,sans-serif;background:var(--bd);color:var(--tx);cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
nav{display:flex;flex-direction:column;gap:6px}
nav button{text-align:left;border:0;background:none;padding:13px 16px;border-radius:16px;font:600 14px Sarabun,sans-serif;color:var(--mu);cursor:pointer;transition:background .15s,color .15s}
nav button:hover{background:var(--soft);color:var(--tx)}
nav button.on{background:var(--dk);color:#fff}
main{flex:1;padding:24px;min-width:0;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:22px;min-width:0;box-shadow:0 10px 30px -5px rgba(0,0,0,.05)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hd h1{margin:0;font-size:21px}.hd p{margin:4px 0 0;color:var(--mu);font-size:13px}
.sub{color:var(--mu);font-size:12.5px;margin:4px 0 14px}
.btn{border:1px solid var(--bd);border-radius:14px;padding:11px 16px;font:600 13px Sarabun,sans-serif;cursor:pointer;background:var(--soft);color:var(--tx);transition:filter .15s,box-shadow .15s}
.btn:hover{filter:brightness(1.05);box-shadow:0 4px 14px rgba(0,0,0,.1)}
.btn.d{background:var(--pri);color:#fff;border-color:transparent}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g4f{grid-template-columns:repeat(4,1fr)}
.st small{color:var(--mu);font-weight:600}
.num{font-size:30px;font-weight:800;margin:10px 0 4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;overflow-wrap:anywhere}
.num span{font-size:13px;color:var(--mu);font-weight:400}
.num.m{font-size:24px}
.big{font-size:56px;font-weight:800;color:var(--pri);text-align:center;margin:14px 0 4px}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#10b981)}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-size:11.5px;font-weight:700;border:1px solid;white-space:nowrap}
.p0,.p1,.p2,.p3,.s-run,.s-done,.s-late,.ev,.btn.g{--c:var(--in);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.p0,.s-done,.ev.ok,.btn.g{--c:var(--gn)}.p1{--c:var(--bl)}.p2{--c:var(--yw)}.p3,.s-late{--c:var(--rd)}
.s-wait{color:var(--mu);background:var(--soft);border-color:var(--bd)}
.s-late{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rd) 45%,transparent)}70%,100%{box-shadow:0 0 0 6px transparent}}
.pc{border:1px solid var(--bd);border-radius:18px;padding:14px;text-align:center;background:var(--card)}
.pc b{display:block;font-size:24px;margin:6px 0 2px}.pc small{color:var(--mu)}
.pc.ok{background:color-mix(in srgb,var(--gn) 12%,transparent)}.pc.ok b{color:var(--gn)}
.pc.wn{background:color-mix(in srgb,var(--yw) 12%,transparent)}.pc.wn b{color:var(--yw)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:14px Sarabun,sans-serif;border:1px solid var(--bd);border-radius:14px;padding:11px 15px;background:var(--soft);color:var(--tx);max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(99,102,241,.18);outline:none;background:var(--card)}
.tools input{flex:1;min-width:200px}.tools select{flex:1;min-width:130px}
.filter-pill-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.f-pill{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 14px;border-radius:99px;font:600 12.5px Sarabun,sans-serif;cursor:pointer}
.f-pill:hover{border-color:var(--pri)}
.f-pill.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.ychips{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.ychip{min-width:100px;padding:6px 10px;border-radius:10px;cursor:pointer;background:var(--card);color:var(--tx);border:1px solid var(--bd);text-align:center}
.ychip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.ychip div:first-child{font-size:10px;opacity:.85}.ychip div:last-child{font-size:12px;font-weight:700;margin-top:1px}

/* ตาราง: พอดีจอ ไม่มีแถบเลื่อนซ้ายขวา */
.tw{width:100%;container-type:inline-size}
.tcard{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:11px 8px;border-top:1px solid var(--bd);vertical-align:middle;text-align:center}
th{background:var(--soft);font-weight:700;color:var(--mu);border-top:0}
td.l{text-align:left;overflow-wrap:break-word}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{transition:background .15s}
tbody tr:hover{background:color-mix(in srgb,var(--pri) 6%,transparent)}
td.empty{color:var(--mu);padding:24px}
.acts{display:inline-flex;gap:4px}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:11.5px;transition:background .15s,color .15s}
.ib:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
.assignee-chip-container{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.assignee-chip{background:var(--soft);color:var(--pri);border:1px solid var(--bd);border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap}
@container (max-width:1050px){
 .rt thead{display:none}
 .rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
 .rt tr{display:flex;flex-direction:column;border-top:1px solid var(--bd);padding:12px 14px}
 .rt tbody tr:first-child{border-top:0}
 .rt td{border:0;padding:4px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
 .rt td::before{content:attr(data-label);color:var(--mu);font-weight:600;text-align:left;flex:none}
 .rt td.main{order:-1;display:block;text-align:left;font-size:13.5px;padding-bottom:8px}
 .rt td.main::before,.rt td.empty::before{display:none}
 .rt td.idx{display:none}
 .rt td.empty{display:block;text-align:center}
 .rt .assignee-chip-container{justify-content:flex-end}
}

/* กราฟแท่งแนวนอน */
.hb-list{max-height:440px;overflow-y:auto;padding-right:4px}
.hb{padding:9px 0;border-bottom:1px dashed var(--bd)}.hb:last-child{border-bottom:0}
.hb-top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12.5px;margin-bottom:6px}
.hb-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1}
.hb-track i{display:block;height:100%;border-radius:99px}
.hb-line{display:flex;align-items:center;gap:8px;font-size:11.5px;margin-top:4px}
.hb-line small{width:44px;color:var(--mu);flex:none}
.hb-line b{width:62px;text-align:right;flex:none}
.legend{display:flex;gap:14px;font-size:12px;font-weight:600;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ปฏิทิน */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal .h{background:var(--soft);border-radius:12px;padding:10px 4px;text-align:center;font-weight:600;font-size:13px}
.cal .d{min-width:0;min-height:110px;border:1px solid var(--bd);border-radius:14px;padding:8px;font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:4px;transition:background .15s}
.cal .d.e{border-color:transparent;opacity:.4}
.cal .d.t{border:2px solid var(--pri)}
.cal .d.t .dn{background:var(--pri);color:#fff;border-radius:8px;padding:1px 8px}
.cal .d.c{cursor:pointer}.cal .d.c:hover{background:var(--soft)}
.pl{font-style:normal;color:var(--pri);opacity:0;font-weight:800}.cal .d.c:hover .pl{opacity:1}
.ev{font-size:11px;font-weight:500;padding:3px 8px;border-radius:99px;border:1px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp{display:flex;gap:12px;align-items:center;justify-content:space-between}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--bd);border-radius:12px;margin-top:6px;font-size:13px;align-items:center;transition:background .15s}
.row:hover{background:var(--soft)}
.row.s{background:var(--soft);color:var(--pri);font-weight:600}

/* Modal */
.mod{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:none;place-items:center;z-index:50;padding:16px}
.mod.on{display:grid}
.mod form,.pbox{background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:28px;width:min(580px,100%);max-height:90vh;overflow:auto;display:grid;gap:16px;box-shadow:0 30px 60px -12px rgba(0,0,0,.4);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.mod label,.mod .fl{font-size:13px;font-weight:700;display:grid;gap:6px;color:var(--tx)}
.chk{display:flex;gap:12px;flex-wrap:wrap}.chk label{display:flex;font-weight:400;align-items:center;gap:6px;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hide{display:none!important}

.pie-container{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;padding:10px 0}
.pie-chart{width:150px;height:150px;flex:none;border-radius:50%;background:var(--bd);position:relative;display:grid;place-items:center}
.pie-chart::after{content:'';position:absolute;width:86px;height:86px;background:var(--card);border-radius:50%}
.pie-legend{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;max-width:280px;max-height:170px;overflow-y:auto}
.pie-item{display:flex;align-items:center;gap:10px}
.pie-dot{width:14px;height:14px;border-radius:6px;flex:none}
.ic{margin-right:10px}.sh,.sw{display:none}

#toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;background:var(--dk);color:#fff;padding:14px 26px;border-radius:99px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none;font-weight:600;box-shadow:0 15px 30px rgba(0,0,0,.3)}
#toast.on{opacity:1}

@media(max-width:820px){
 body{flex-direction:column;padding-bottom:84px}
 aside{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:12px;gap:10px;border-right:0;border-bottom:1px solid var(--bd);overflow:visible}
 aside>div[style="flex:1"],aside .box:last-child,aside .box small{display:none}
 aside .box{padding:8px;flex:1}.logo img{width:38px;height:38px}.logo b{font-size:15px;white-space:nowrap}
 nav{position:fixed;left:0;right:0;bottom:0;z-index:40;flex-direction:row;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
 nav button{flex:1;min-width:0;padding:6px 2px;text-align:center;font-size:11px;border-radius:12px}
 .ic{display:block;margin:0 0 2px;font-size:19px}.lb{display:none}.sh{display:block}.sw{display:inline}.fw{display:none}
 main{padding:12px;gap:12px}.card{padding:16px;border-radius:20px}.hd h1{font-size:18px}
 .hd .tools{width:100%}.hd .tools .btn{flex:1;padding:8px 6px;font-size:12px}.hd .tools #dm{flex:none}
 .g4,.g4f{grid-template-columns:repeat(2,1fr)}
 .num{font-size:22px}.num.m{font-size:18px}.big{font-size:42px}.pc b{font-size:20px}.two{grid-template-columns:1fr}
 .tools input,.tools select{min-width:100%;flex:1 1 100%}
 .sales-filter-grid{grid-template-columns:1fr!important}
 .cal{gap:3px}.cal .d{min-height:64px;padding:4px;font-size:11px;border-radius:8px}.cal .h{padding:6px 2px;font-size:11px}
 .ev{font-size:9px;padding:1px 4px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<aside>
 <div class="logo"><img src="logo.png" alt="Logo" onerror="this.style.display='none'"><div><b>BEST SERVICE KK</b></div></div>
 <div class="box"><small>🛡 สิทธิ์ผู้ใช้งาน:</small><div class="seg"><button id="rH">👑 หัวหน้างาน</button><button id="rE" class="on">👤 พนักงาน</button></div></div>
 <nav id="nav"></nav>
 <div style="flex:1"></div>
 <div class="box"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mu)"><span>สถานะระบบ:</span><b style="color:var(--gn)">⚡ เรียลไทม์</b></div><div id="today" style="font:12px monospace;color:var(--pri);margin-top:8px"></div></div>
</aside>
<main>
 <div class="card hd"><div><h1 id="ttl"></h1><p id="sub"></p></div>
  <div class="tools"><button class="btn" id="dm">🌙</button><button class="btn g" id="ex">⬇ ส่งออก CSV</button><button class="btn d" id="nt">＋ คีย์งานใหม่</button></div></div>
 <div id="v"></div>
</main>
<div class="mod" id="lm"><form id="lf"><h3 style="margin:0">เข้าสู่ระบบหัวหน้างาน</h3><label>อีเมล<input type="email" name="em" required autocomplete="username"></label><label>รหัสผ่าน<input type="password" name="pw" required autocomplete="current-password"></label><div id="le" style="color:var(--rd);font-size:13px"></div><div class="tools" style="justify-content:flex-end"><button type="button" class="btn" onclick="lm.classList.remove('on')">ยกเลิก</button><button class="btn d">เข้าสู่ระบบ</button></div></form></div>
<div class="mod" id="pm"><div class="pbox" id="pb"></div></div>
<div id="toast"></div>
<div class="mod" id="mod"><form id="f"></form></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PR=['ปกติ','สำคัญ','ด่วน','ด่วนมาก'],TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=ymd(new Date()),dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:0};
const money=v=>num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const kfmt=v=>{v=num(v);const a=Math.abs(v);if(a>=1e6)return (v/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';if(a>=1e3)return (v/1e3).toFixed(a>=1e5?0:1).replace(/\.0$/,'')+'k';return String(Math.round(v))};
const profitOf=x=>x.profit!=null&&x.profit!==''?num(x.profit):num(x.val)-num(x.cost);
const pctW=(v,max)=>Math.max(0,Math.min(100,max>0?v/max*100:0));
let T=[],E=[],Contracts=[],Sales=[],view='ov',subView='ov1',head=false,cm=new Date(),flt={q:'',e:'',s:'',p:''},salesYear='',salesFlt={q:'',s:''},contractFlt={q:'',s:''},db=null,edit=null,editC=null,editS=null,myId='';
$('#today').textContent=TODAY;
setInterval(()=>{if(ymd(new Date())!==TODAY)location.reload()},60000);

let actx;
function playBeep(type='success'){
  try{
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    actx=actx||new A();const ctx=actx,osc=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime;
    osc.type='sine';
    if(type==='success'){osc.frequency.setValueAtTime(587.33,t);osc.frequency.setValueAtTime(880,t+.08)}
    else{osc.frequency.setValueAtTime(300,t);osc.frequency.setValueAtTime(200,t+.1)}
    gain.gain.setValueAtTime(.15,t);gain.gain.exponentialRampToValueAtTime(.001,t+.3);
    osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(t+.3);
  }catch(e){}
}

const status=t=>t.progress>=100?'เสร็จสิ้น':t.progress>0?'กำลังดำเนินการ':'รอเริ่ม';
const left=t=>t.progress>=100?{x:'เสร็จสิ้นแล้ว',c:'s-done'}:(n=>n<0?{x:'เลยกำหนด '+(-n)+' วัน',c:'s-late'}:{x:'เหลือ '+n+' วัน',c:n<=3?'p2':'s-wait'})(dd(t.deadline,TODAY));
const near=t=>t.progress<100&&dd(t.deadline,TODAY)<=3;
const nm=id=>(E.find(e=>e.id===id)||{name:'(ไม่พบ)'}).name;
const sc=s=>s==='เสร็จสิ้น'?'s-done':s==='รอเริ่ม'?'s-wait':'s-run';
const avg=a=>a.length?Math.round(a.reduce((s,t)=>s+t.progress,0)/a.length):0;
const mine=id=>T.filter(t=>t.assignees.includes(id));
const lock=what=>`<div class="card" style="text-align:center;padding:50px 20px;color:var(--rd)"><h3>🔒 สำหรับหัวหน้างานเท่านั้น</h3><p>คุณไม่มีสิทธิ์เข้าถึง${what} กรุณาเข้าสู่ระบบด้วยสิทธิ์หัวหน้างาน</p></div>`;
const dueBadge=d=>{if(!d)return '<span style="color:var(--mu);font-size:11px">ไม่ระบุ</span>';const n=dd(d,TODAY);return n<0?`<span class="pill s-late">เลย ${-n} วัน</span>`:n<=3?`<span class="pill p2">ใกล้ถึงกำหนด (${n} วัน)</span>`:`<span class="pill s-wait">เหลือ ${n} วัน</span>`};

const VIEWS={
  ov:['หน้าภาพรวมรายงาน (Overview Report)','ภาพรวม (Overview)'],
  tb:['ตารางงานทั้งหมด (Task List Table)','ตารางงาน'],
  cal:['ปฏิทินวางแผนงานรายเดือน (Monthly Planner)','ปฏิทินรายเดือน'],
  em:['รายชื่อพนักงานในแผนกและการมอบหมายงาน','พนักงานในแผนก'],
  ct:['บริหารจัดการสัญญาโครงการและรายได้','สัญญาโครงการ'],

/* ---------- Dashboard การเงิน (ใช้ร่วมกันทั้งสัญญาและงานขาย) ---------- */
const COLORS=['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#3b82f6','#14b8a6','#f97316','#84cc16'];
const EMPTY='<p style="color:var(--mu);font-size:13px;text-align:center;padding:30px 0">ยังไม่มีข้อมูล</p>';
function groupByLoc(arr){
  const m={};
  arr.forEach(x=>{const k=(x.loc||'').trim()||'ไม่ระบุสถานที่';const o=m[k]||(m[k]={name:k,val:0,cost:0,profit:0,count:0});o.val+=num(x.val);o.cost+=num(x.cost);o.profit+=profitOf(x);o.count++});
  return Object.values(m).sort((a,b)=>b.val-a.val);
}
function pieHTML(items,total){
  let acc=0;
  const sl=items.map((it,i)=>{const p=total>0?Math.max(0,it.val)/total*100:0;const s={...it,p,start:acc,end:acc+p,color:COLORS[i%COLORS.length]};acc+=p;return s});
  const grad=total>0?sl.map(s=>`${s.color} ${s.start}% ${s.end}%`).join(','):'var(--bd) 0% 100%';
  return `<div class="pie-container"><div class="pie-chart" style="background:conic-gradient(${grad})"></div><div class="pie-legend">${sl.map(s=>`<div class="pie-item"><div class="pie-dot" style="background:${s.color}"></div><span style="font-size:12px">${esc(s.name)} (${s.p.toFixed(1)}%)</span></div>`).join('')||'<span style="color:var(--mu)">ยังไม่มีข้อมูล</span>'}</div></div>`;
}
function valBars(items,color){
  const max=Math.max(1,...items.map(i=>i.val));
  return items.length?`<div class="hb-list">${items.map(i=>`<div class="hb"><div class="hb-top"><span class="hb-name" title="${esc(i.name)}">${esc(i.name)}</span><b>${money(i.val)}</b></div><div class="hb-track"><i style="width:${pctW(i.val,max)}%;background:${color}"></i></div></div>`).join('')}</div>`:EMPTY;
}
function cpBars(items){
  const max=Math.max(1,...items.map(i=>Math.max(i.cost,i.profit)));
  return items.length?`<div class="hb-list">${items.map(i=>{const m=i.cost>0?(i.profit/i.cost*100).toFixed(1):'0.0';return `<div class="hb">
    <div class="hb-top"><span class="hb-name" title="${esc(i.name)}">${esc(i.name)}</span><span class="pill p0" style="padding:2px 8px;font-size:10.5px">กำไร ${m}% ของต้นทุน</span></div>
    <div class="hb-line"><small>ต้นทุน</small><div class="hb-track"><i style="width:${pctW(i.cost,max)}%;background:var(--yw)"></i></div><b title="${money(i.cost)}">${kfmt(i.cost)}</b></div>
    <div class="hb-line"><small>กำไร</small><div class="hb-track"><i style="width:${pctW(i.profit,max)}%;background:var(--gn)"></i></div><b title="${money(i.profit)}">${kfmt(i.profit)}</b></div></div>`}).join('')}</div>`:EMPTY;
}
function finDash(arr,o){

    <div class="card"><b>📊 ${o.barT}</b><p class="sub">มูลค่า Pre-VAT เรียงจากมากไปน้อย</p>${valBars(items,o.color)}</div>
  </div>
  <div class="card" style="margin-top:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px">
      <div><b>📊 เปรียบเทียบต้นทุนและกำไรสุทธิแยกตามโรงพยาบาล</b><p class="sub" style="margin-bottom:0">พร้อมอัตรากำไรเทียบต้นทุน (% Margin)</p></div>

    </div>${cpBars(items)}</div>`;
}

/* ---------- สัญญาโครงการ ---------- */
const filteredContracts=()=>{const q=contractFlt.q.trim().toLowerCase();return Contracts.filter(c=>(!q||[c.name,c.code,c.loc].join(' ').toLowerCase().includes(q))&&(!contractFlt.s||c.status===contractFlt.s))};
function contracts(){
  if(!head)return lock('ข้อมูลสัญญาโครงการ');
  const list=filteredContracts();
  const tv=list.reduce((s,c)=>s+num(c.val),0),tc=list.reduce((s,c)=>s+num(c.cost),0),tp=list.reduce((s,c)=>s+profitOf(c),0);

function cal(){
  const y=cm.getFullYear(),m=cm.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  let h=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'].map((d,i)=>`<div class="h" style="${i==5?'color:var(--in)':i==6?'color:var(--rd)':''}"><span class="fw">วัน${d}</span><span class="sw">${['จ','อ','พ','พฤ','ศ','ส','อา'][i]}</span></div>`).join('');
  for(let i=0;i<off;i++)h+='<div class="d e"></div>';
  for(let d=1;d<=n;d++){
    const s=ymd(new Date(y,m,d));
    h+=`<div class="d ${s===TODAY?'t':''} c" onclick="showDay('${s}')"><div style="display:flex;justify-content:space-between"><span class="dn">${d}</span>${head?'<em class="pl">＋</em>':''}</div>${T.filter(t=>t.start<=s&&s<=t.end).map(t=>`<div class="ev ${t.progress>=100?'ok':''}" style="cursor:pointer" title="${esc(t.title)}" onclick="event.stopPropagation();showT('${esc(t.id)}')">${esc(t.title)}</div>`).join('')}</div>`;
  }
  return `<div class="card hd"><div><b style="font-size:18px">📅 ${TH[m]} ${y+543}</b><p>ปฏิทินวางแผนงานรายเดือน (วันจันทร์ - วันอาทิตย์)${head?' • คลิกวันที่เพื่อดู/เพิ่มงาน คลิกชื่องานเพื่อดูรายละเอียด':''}</p></div><div class="tools"><button class="btn" onclick="cm=new Date(${y},${m-1},1);render()">‹</button><button class="btn" onclick="cm=new Date();render()">เดือนปัจจุบัน</button><button class="btn" onclick="cm=new Date(${y},${m+1},1);render()">›</button></div></div><div class="card cal" style="margin-top:16px">${h}</div>`;
}

function downloadCSV(name,h,r){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='\ufeff'+[h,...r].map(x=>x.map(q).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name+'-'+TODAY+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

  document.querySelector("main").insertAdjacentHTML("afterbegin",'<div class="card" style="border-color:#e11d48;color:#e11d48">ยังไม่ได้ตั้งค่า Firebase: เปิดไฟล์ index.html แล้ววาง API Key ตรงส่วน const FB</div>');
}else{
  const app=initializeApp(FB),fs=getFirestore(app),au=getAuth(app);
  window.login=(e,p)=>signInWithEmailAndPassword(au,e,p);
  window.logout=()=>signOut(au);
  window.initDb({
    collection:n=>({onSnapshot:(ok,er)=>onSnapshot(collection(fs,n),s=>ok({docs:s.docs}),er)}),
    doc:p=>({set:d=>setDoc(doc(fs,p),d),update:d=>updateDoc(doc(fs,p),d),delete:()=>deleteDoc(doc(fs,p))})
  });
  onAuthStateChanged(au,async u=>{
    if(!u){window.setUser(false);return}
    let ok=false;
    try{const tk=await getIdTokenResult(u,true);ok=tk.claims.role==='manager'}catch(e){console.error(e)}
    const email=(u.email||'').toLowerCase();
    if(!ok)ok=MANAGER_EMAILS.length===0||MANAGER_EMAILS.map(x=>x.toLowerCase()).includes(email);
    if(!ok){alert('บัญชีนี้ไม่มีสิทธิ์หัวหน้างาน');await signOut(au);return}
    window.setUser(true);
  });
}
</script>
</body></html>
